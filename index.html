m1_nav:"1. 規模與隱形冠軍",m1_title:"隱形冠軍與規模經濟 (Hidden Champion & Scale Economies)",
m1_p1:"伸興工業 (Zeng Hsing) 創立於 1968 年，最初只是一家位於台中的小零件廠。歷經半個世紀的演進，它不僅打敗了日本大廠，更成為全球家用縫紉機代工的絕對霸主（市佔率逾 30%）。這種專注於高度利基的 B2B 市場，不為一般大眾熟知卻擁有全球定價權的企業，被德國學者 Hermann Simon 稱為「隱形冠軍 (Hidden Champion)」。",
m1_p2:"「在傳統製造業，當你的產量是對手的數倍時，你的採購成本與折舊攤提就成了對手無法跨越的護城河。」",
m1_p3:"伸興的成功基石是標準的「成本領導策略 (Cost Leadership)」。透過承接全球第一大品牌 Singer（勝家）與瑞士 Bernina 等國際大廠的 ODM 訂單，伸興獲得了龐大的訂單基數。這帶來了顯著的「規模經濟 (Economies of Scale)」，使其能以極低的單位成本採購原物料與分攤模具費用。",
m1_p4:"同時，縫紉機製造涉及複雜的精密機械組裝。數十年的海量生產讓伸興在「經驗曲線 (Experience Curve)」上遙遙領先對手。這種透過「做中學 (Learning by doing)」累積的良率控制與製程優化能力，構成了強大的進入障礙。",
m1_cards:[
  {title:"隱形冠軍 (Hidden Champion)",desc:"專注於特定利基市場，雖然大眾知名度低，但市佔率名列全球前三名，具備深厚的技術壁壘與不可替代性。伸興是台灣傳統產業隱形冠軍的代表。"},
  {title:"規模經濟的雙面刃",desc:"龐大產量帶來了極低的平均單位成本，使對手難以發動價格戰；但高度依賴規模也意味著，一旦大客戶抽單，高昂的固定資產折舊將瞬間吞噬利潤。"},
  {title:"經驗曲線 (Experience Curve)",desc:"隨著累積生產量的加倍，單位附加價值成本會規律下降。縫紉機零件繁多，伸興透過數千萬台的組裝經驗，達成了極致的生產效率。"},
  {title:"ODM (委託設計代工)",desc:"有別於單純依圖施工的 OEM，伸興具備強大的研發設計能力 (ODM)。這提高了客戶的轉換成本 (Switching Costs)，使國際大廠不敢輕易更換代工廠。"}
],
m1_terms:[
  {front:"Hidden Champion\n隱形冠軍",back:"由 Hermann Simon 提出，指在特定利基市場擁有全球頂尖市佔率，技術專精但大眾知名度不高的中堅企業。"},
  {front:"Economies of Scale\n規模經濟",back:"隨著企業生產規模的擴大，固定成本得以分攤在更多單位產品上，導致長期平均總成本下降的經濟現象。"},
  {front:"Experience Curve\n經驗曲線",back:"企業隨著累積產量增加，透過持續的流程改善與員工熟練度提升，使單位成本按固定比例下降的規律。"}
],
m1_q:[
  {q:"伸興工業被稱為「隱形冠軍」(Hidden Champion)，這類企業通常具備什麼特徵？",opts:["砸重金在電視上打廣告的消費品牌","在高度利基的 B2B 或專業市場中擁有全球領先的市佔率，但大眾知名度不高","跨足幾十個完全不相關產業的複合集團","只有幾十名員工的新創公司"],ans:1,exp:"隱形冠軍專注於極度細分的市場（如家用縫紉機製造），默默賺取高額利潤並掌握全球供應鏈關鍵環節。"},
  {q:"伸興憑藉龐大的代工訂單，能以比對手更低的平均成本生產縫紉機，這主要體現了策略管理中的哪一種經濟學原理？",opts:["範疇經濟 (Economies of Scope)","規模經濟 (Economies of Scale)","網路外部性 (Network Externalities)","破壞性創新"],ans:1,exp:"產量越大，模具開發與廠房折舊等固定成本就能分攤得越薄，這就是規模經濟帶來的成本領導優勢。"},
  {q:"在波特 (Michael Porter) 的總體策略中，伸興透過極致的製造效率與規模優勢稱霸全球代工市場，這屬於哪一種策略？",opts:["差異化策略 (Differentiation)","成本領導策略 (Cost Leadership)","非相關多角化","藍海策略"],ans:1,exp:"伸興的競爭核心在於能以同業無法匹敵的低成本，提供高品質的代工服務，是經典的成本領導策略。"},
  {q:"伸興從早期的純代工 (OEM) 升級為協同設計製造 (ODM)，這對品牌客戶產生了什麼策略效果？",opts:["讓客戶更容易更換代工廠","提高了客戶的「轉換成本」(Switching Costs)，增強了伸興的客戶黏著度與議價能力","降低了伸興的毛利率","完全沒有影響"],ans:1,exp:"當代工廠掌握了產品的底層設計與專利時，品牌商若想更換代工廠將面臨極高的重新設計與磨合成本。"},
  {q:"「經驗曲線」(Experience Curve) 對伸興這樣的傳統精密製造業而言，最大的戰略意義是什麼？",opts:["累積了競爭對手無法在短期內用金錢買到的「做中學」(Learning-by-doing) 隱性製程知識與良率優勢","讓員工的年紀變大","增加產品的碳排放","讓機器容易損壞"],ans:0,exp:"組裝複雜的縫紉機需要無數的 know-how，數千萬台的累積產量讓伸興擁有對手難以跨越的製程經驗壁壘。"}
],

m2_nav:"2. 垂直整合",m2_title:"垂直整合與交易成本 (Vertical Integration & TCE)",
m2_p1:"家用縫紉機是由數百個精密金屬與塑膠零件組成的產品。過去，台灣多數組裝廠依賴外部的衛星工廠（如鑄造、烤漆、塑膠射出）供應零組件。然而，伸興卻採取了高度的「向後垂直整合 (Backward Vertical Integration)」策略。",
m2_p2:"伸興在廠內自建了鋁合金壓鑄廠、塑膠射出廠，甚至連最核心的「梭床」都自行生產。為什麼不向外部購買 (Buy) 而要自己做 (Make)？",
m2_p3:"從「交易成本經濟學 (Transaction Cost Economics, TCE)」的角度來看，當市場供應商的品質不穩定、交期難以掌控，或者市場上只有少數幾家獨佔供應商時，「市場的交易摩擦成本」就會異常高昂。此外，為伸興開模具屬於高度的「專屬性資產 (Asset Specificity)」投資，極易引發「套牢問題 (Hold-up Problem)」——供應商可能藉此勒索漲價。",
m2_p4:"透過將關鍵零組件「內部化」，伸興消除了外部交易的談判與監督成本，確保了極致的交期彈性與良率控制。這種深度的垂直整合，雖然加重了固定資產負擔，但也成為新進競爭者極難跨越的資本與技術門檻。",
m2_cards:[
  {title:"向後垂直整合 (Backward Integration)",desc:"企業將價值鏈向原物料或零組件等上游方向延伸。伸興自建壓鑄與射出廠，將原本屬於供應商的利潤與控制權收回內部。"},
  {title:"套牢問題 (Hold-up Problem)",desc:"當交易需要投入「專屬性資產」(如特定規格的模具)，一旦投入後難以轉做他用，投資方就容易被對方威脅剝削。內部化是解決套牢的終極手段。"},
  {title:"交易成本經濟學 (TCE)",desc:"Ronald Coase 與 Oliver Williamson 的理論。企業選擇「做(Make)」是因為市場機制的尋找、談判、監督等「交易成本」大於企業內部的「行政管理成本」。"},
  {title:"彈性與成本的權衡",desc:"垂直整合能掌握品質與交期，但也將大量資金鎖死在硬體設備上。若產業技術發生劇變，垂直整合的企業往往會因為「船大難掉頭」而喪失策略彈性。"}
],
m2_terms:[
  {front:"Backward Vertical Integration\n向後垂直整合",back:"企業將價值鏈往上游供應商方向延伸，自行生產原本需要外購的原物料或零組件。"},
  {front:"Hold-up Problem\n套牢問題",back:"交易雙方因投入了高度專屬性的資產而產生相互依賴，導致其中一方可能面臨被對方伺機敲詐或勒索的風險。"},
  {front:"Transaction Costs\n交易成本",back:"使用市場價格機制進行交易所產生的摩擦成本，包含尋找供應商、議價談判、擬定合約與後續監督的成本。"}
],
m2_q:[
  {q:"伸興自建鋁合金壓鑄廠與塑膠射出廠，不依賴外部供應商，這在企業策略上稱為？",opts:["向前垂直整合 (Forward Integration)","向後垂直整合 (Backward Integration)","水平併購 (Horizontal M&A)","非相關多角化"],ans:1,exp:"企業將價值鏈往上游零組件供應端延伸，自行製造生產要素，稱為向後垂直整合。"},
  {q:"根據「交易成本經濟學 (TCE)」，伸興選擇將關鍵零組件「自己做 (Make)」而非「向外買 (Buy)」的核心原因是什麼？",opts:["因為外部市場的交易成本（如尋找、談判、防範品質不佳與被套牢的風險）高於企業內部的行政協調成本","因為自己做一定比較便宜","為了增加政府稅收","為了讓員工有更多事做"],ans:0,exp:"TCE 理論認為，企業的邊界取決於內部行政成本與外部市場交易成本的拉鋸。當市場摩擦過大時，內部化是最佳選擇。"},
  {q:"當伸興要求外部供應商開發生產縫紉機專用的特殊模具時，供應商會面臨哪一種風險，導致他們不願配合或要求極高價格？",opts:["匯率風險","套牢風險 (Hold-up Risk)，因為該模具屬於高度「專屬性資產」，無法輕易轉賣給其他客戶","氣候變遷風險","品牌延伸風險"],ans:1,exp:"專屬性資產投資會產生沉沒成本，使得投資方在後續談判中處於劣勢（容易被客戶要脅降價），因此市場機制容易失靈。"},
  {q:"高度的垂直整合雖然能確保品質與交期，但會為企業帶來何種潛在劣勢？",opts:["品牌知名度暴增","龐大的固定資產投資會導致企業失去「策略彈性」，在景氣不佳時面臨沉重的折舊壓力","完全不用管理供應鏈","自動獲得政府補助"],ans:1,exp:"垂直整合讓企業變得「重資產」，當市場需求反轉或技術變革時，沉重的設備與廠房將成為轉型的巨大絆腳石。"},
  {q:"伸興將核心零組件（如精密梭床）內部化生產，除了降低交易成本外，還有什麼重要的策略意義？",opts:["為了轉行做房地產","為了嚴格保護核心製程機密 (Intellectual Property) 與默會知識，防止技術外流培養出未來的競爭對手","為了增加碳排放","完全沒有意義"],ans:1,exp:"將最核心、最難製造的關鍵零組件留在自家工廠，是代工廠維持技術壁壘、防止供應商或離職員工輕易複製的關鍵手段。"}
],

m3_nav:"3. 全球佈局與南向",m3_title:"全球佈局與 CAGE 距離 (Global Footprint)",
m3_p1:"2000 年代初期，當絕大多數台灣傳統產業將工廠大舉遷往中國大陸（追求廉價勞工）時，伸興的經營團隊卻做出了極具前瞻性的決策：前往越南設廠。伸興是台灣最早實踐「China Plus One（中國以外的備用產能）」策略的隱形冠軍之一。",
m3_p2:"企業的跨國直接投資 (FDI) 有多種動機。伸興赴越南設廠，是標準的「尋求效率 (Efficiency-seeking)」動機。隨著中國大陸沿海工資快速飛漲，越南提供了更具吸引力的「區位優勢 (Location Advantages)」——充沛且年輕的廉價勞動力。",
m3_p3:"此外，全球貿易法規也是關鍵推手。歐盟對來自中國的某些產品課徵反傾銷稅，而越南享有普惠制 (GSP) 關稅優惠。透過轉移生產基地，伸興成功運用了「法規套利 (Regulatory Arbitrage)」。",
m3_p4:"然而，跨國擴張必然面臨 Ghemawat 提出的「CAGE 距離」摩擦。伸興在越南建廠初期，遭遇了巨大的「行政距離」(繁瑣的官僚與法規) 與「文化距離」(越籍勞工的管理與罷工問題)。跨越這些「外來者劣勢 (Liability of Foreignness)」的學習成本極高，但一旦克服，這套跨國管理能力反而成為後來者難以複製的競爭優勢。",
m3_cards:[
  {title:"尋求效率 (Efficiency-seeking)",desc:"跨國投資的主要動機之一。尋找全球要素成本（如勞工、土地）最低的地區來配置勞力密集的生產環節，以極大化成本領導優勢。"},
  {title:"China Plus One 策略",desc:"為了分散過度集中於單一國家的政治與經濟風險（如工資暴漲、貿易戰），跨國企業在中國以外的地區（如東南亞）建立第二生產基地的策略。"},
  {title:"套利 (Arbitrage)",desc:"Ghemawat 的 AAA 跨國策略之一。利用不同國家之間的要素價格落差或關稅法規差異來獲利（例如利用越南的免稅優惠出口至歐洲）。"},
  {title:"外來者劣勢 (Liability of Foreignness)",desc:"外商因為不熟悉地主國的文化、語言、法律與商業網絡，初期必須付出遠高於本土企業的營運摩擦成本。"}
],
m3_terms:[
  {front:"Foreign Direct Investment (FDI)\n外人直接投資",back:"企業跨越國界，對海外的實體生產設施進行具有實質控制權的資本投資（如伸興在越南建廠）。"},
  {front:"CAGE Framework\nCAGE 距離架構",back:"衡量雙邊市場在文化(Culture)、行政(Administration)、地理(Geography)、經濟(Economy)四個維度上差異的分析框架。"},
  {front:"Regulatory Arbitrage\n法規套利",back:"企業利用不同國家或地區間法律、稅制、環保或勞動法規的差異，進行跨國佈局以節省成本的策略。"}
],
m3_q:[
  {q:"伸興早期將大部分產能從台灣與中國轉移至越南，最主要的國際化動機為何？",opts:["尋求市場 (賣縫紉機給越南人)","尋求策略性資產 (併購越南科技公司)","尋求效率 (利用越南年輕且廉價的勞動力來降低製造成本)","尋求天然資源"],ans:2,exp:"縫紉機組裝仍屬勞力密集產業，將廠房移至工資較低的越南，是典型的「尋求效率」以維持成本領導優勢的策略。"},
  {q:"利用越南出口至歐盟享有較低或免關稅的優惠，這在跨國策略中被稱為什麼行為？",opts:["文化調適 (Adaptation)","法規套利 (Regulatory Arbitrage)","全球標準化 (Aggregation)","非相關多角化"],ans:1,exp:"利用國與國之間的法規或稅制落差來獲取利潤或降低成本，是 Ghemawat 提出的 AAA 策略中的「套利 (Arbitrage)」。"},
  {q:"伸興在越南建廠初期，曾面臨越籍幹部管理困難與罷工問題。在 CAGE 距離架構中，這主要反映了哪一種距離帶來的摩擦？",opts:["經濟距離 (人均 GDP 差距)","文化距離 (勞工價值觀、管理風格與溝通障礙)","地理距離 (距離太遠)","虛擬距離"],ans:1,exp:"不同國家的勞工對權威、工作態度與溝通方式的認知差異極大，這是跨國管理中最難克服的「文化距離」。"},
  {q:"「外來者劣勢」(Liability of Foreignness) 對於跨國企業而言意味著什麼？",opts:["外國企業一定會受到當地消費者的歡迎","因為不熟悉地主國的法規、文化與政商網絡，初期必須承擔比本土企業更高的學習與營運成本","外國企業不用繳稅","外商必定會失敗"],ans:1,exp:"外來者劣勢是所有跨國企業的必經之痛，企業必須依賴其「所有權優勢 (如優異的製程專利或管理能力)」來抵銷這些額外成本。"},
  {q:"為何近年來全球許多製造業都開始效仿伸興實行「China Plus One」策略？",opts:["因為中國市場消失了","為了分散過度集中於單一國家的地緣政治風險與工資上漲壓力，建構「供應鏈韌性」","因為中國氣候變遷","為了增加碳足跡"],ans:1,exp:"將所有產能集中在一國雖然能達到規模經濟極致，但面臨貿易戰或封城等突發事件時風險極高。分散佈局是為了買保險（韌性）。"}
],

m4_nav:"4. 併購與多角化",m4_title:"多角化併購與綜效 (M&A & Diversification)",
m4_p1:"家用縫紉機是一個高度成熟的產業，全球市場規模增長緩慢。當企業在核心事業遇到成長天花板時，通常會啟動「多角化 (Diversification)」策略尋找第二成長曲線。",
m4_p2:"伸興在近年選擇透過「併購 (M&A)」跨足全新領域。最受矚目的案例是入主「宇隆科技」(精密金屬加工廠，主要客戶為 Bosch 等全球車廠與自行車大廠)。",
m4_p3:"從表面上看，縫紉機與汽車零件似乎毫不相干。但從策略管理的「範疇經濟 (Economies of Scope)」來看，這是一次精彩的「相關多角化 (Related Diversification)」。伸興的壓鑄與加工技術，與宇隆的精密金屬切削技術，在底層的「製造工程與管理邏輯」上高度重疊（策略相關性）。",
m4_p4:"這項併購案意圖創造多重「綜效 (Synergy)」：(1) 伸興可以利用宇隆在車用市場的認證與通路，幫助自身的精密金屬零件打入高毛利的車用供應鏈；(2) 雙方聯合採購原物料以增強議價能力；(3) 透過內部資本市場，伸興穩定且豐沛的縫紉機「金牛」現金流，可以支援宇隆未來在全球擴廠的資金需求。",
m4_cards:[
  {title:"相關多角化 (Related Diversification)",desc:"進入與現有核心事業在技術、製造流程或市場通路上有顯著共通點的新事業。縫紉機與車用加工同屬「精密機械製造」的底層邏輯。"},
  {title:"綜效 (Synergy)",desc:"1+1>2 的魔法。伸興與宇隆結合後，共享採購資源（成本綜效）與互相導入客戶供應鏈（營收綜效），創造了單獨存在時無法達成的價值。"},
  {title:"逃離成熟產業",desc:"當核心產業的生命週期進入成熟衰退期，企業必須將榨取出來的自由現金流 (Cash Cow) 投入具備更高成長潛力的明星產業 (Stars)。"},
  {title:"併購的風險 (PMI)",desc:"跨足新領域的併購，最大的挑戰在於「併購後整合 (Post-Merger Integration)」。如何讓兩家文化不同的公司高階主管放下成見，真正落實資源共享，是成敗關鍵。"}
],
m4_terms:[
  {front:"Related Diversification\n相關多角化",back:"企業擴展至與現有核心業務在價值鏈活動（如研發、製造、行銷）上有實質關聯的新市場，以獲取範疇經濟。"},
  {front:"Synergy\n綜效",back:"兩個或多個事業體整合後，由於資源共享或能力移轉，所創造出大於各獨立事業體價值總和的額外價值。"},
  {front:"Post-Merger Integration\n併購後整合",back:"併購交易完成後，將兩家公司的營運、系統、人員與文化實際結合在一起，以實現預期綜效的艱難過程。"}
],
m4_q:[
  {q:"家用縫紉機市場成長緩慢，伸興透過併購宇隆科技跨足車用精密加工。這主要屬於哪一種成長策略？",opts:["水平併購 (收購同業對手)","垂直整合 (收購上下游)","相關多角化 (跨足具有底層技術共通性的新產業)","完全非相關多角化 (如跨足餐飲業)"],ans:2,exp:"縫紉機組裝與車用零件加工，兩者皆高度依賴「精密金屬加工與品質控制」的核心能力，因此屬於相關多角化。"},
  {q:"多角化併購要能為股東創造價值的核心前提是什麼？（即 Porter 的相得益彰測試 Better-off Test）",opts:["併購必須花費大筆現金","合併後的新公司必須能創造出獨立運作時無法產生的「綜效 (Synergy)」（如成本節約或交叉銷售）","必須解雇一半的員工","必須買在國外的公司"],ans:1,exp:"若併購不能產生 1+1>2 的實質資源互補或能力移轉效應，那麼股東自己去買宇隆的股票就好，不需要伸興代勞。"},
  {q:"伸興擁有強大的壓鑄技術，宇隆擁有打入歐洲車廠 (如 Bosch) 的嚴格認證與通路。雙方結合最希望能產生哪一種綜效？",opts:["財務套利綜效","營收綜效 (Revenue Synergy，伸興的零件藉由宇隆的通路打入車用市場)","裁員綜效","避稅綜效"],ans:1,exp:"透過整合彼此互補的「技術」與「市場通路」，共同將產品推向新客戶以增加總營收，是典型的營收綜效。"},
  {q:"在 BCG 投資組合矩陣的邏輯中，伸興將家用縫紉機（成長慢、市佔高、現金充沛）所賺取的現金，拿去併購並投資具備高成長潛力的車用零件事業。這符合哪一種資源配置策略？",opts:["用「落水狗」投資「問號」","把「金牛 (Cash Cows)」擠出的現金流，去扶植未來的「明星 (Stars)」或「問號」事業","把「明星」的錢分給「落水狗」","完全不投資"],ans:1,exp:"成熟事業的金牛是企業的資金庫，策略管理的精髓就是將金牛的資金引導至未來能接棒成為新金牛的高成長事業。"},
  {q:"跨足新領域的併購案，經常失敗的「非財務因素」致命傷通常是什麼？",opts:["兩家公司的名字字母數不同","「併購後整合 (PMI)」的失敗，包含嚴重的組織文化衝突、爭奪主導權以及核心人才流失","買貴了","政府反對"],ans:1,exp:"買下公司只是第一步，如何讓兩群不同文化的人願意打破穀倉 (Silos) 共享資源，是併購能否實現綜效的最難關卡。"}
],

m5_nav:"5. 微笑曲線兩難",m5_title:"微笑曲線的兩難：代工與品牌 (OEM vs OBM)",
m5_p1:"製造業常面臨「微笑曲線 (Smiling Curve)」的困境：價值鏈兩端的研發設計 (R&D) 與品牌行銷 (Brand) 附加價值最高，而中段的製造組裝 (Manufacturing) 競爭最激烈、毛利最低。身為全球代工霸主，伸興的獲利能力已達製造端的極致。",
m5_p2:"為了賺取品牌溢價，許多代工廠都會萌生「自創品牌 (OBM, Original Brand Manufacturing)」的念頭。既然所有的設計與製造都是我做的，為什麼我不能貼上自己的牌子，賺取通路上豐厚的利潤？",
m5_p3:"然而，從代工走向品牌，是一條充滿荊棘的險路。最大的致命傷在於「通路衝突 (Channel Conflict)」。當代工廠推出自有品牌時，它立刻從客戶的「合作夥伴」變成了「直接競爭對手」。這觸犯了代工業的大忌，大客戶（如 Singer）極可能會為防範技術外流與市場遭蠶食，而無情地抽單或轉單。",
m5_p4:"此外，代工廠的 DNA 是「成本控制與極致效率」，而品牌經營需要的是「行銷、消費者心理學與彈性容錯」。兩者的核心能耐與組織文化截然不同。因此，伸興在面對 OBM 轉型時極度謹慎，選擇透過併購上游零件或周邊產業來擴張，而非直接在縫紉機市場與老客戶正面廝殺。",
m5_cards:[
  {title:"微笑曲線 (Smiling Curve)",desc:"施振榮提出的概念。產業價值鏈中，附加價值呈現 U 型分佈。左端是專利與研發，右端是品牌與服務，底端是代工組裝。"},
  {title:"通路衝突 (Channel Conflict)",desc:"代工廠轉做自有品牌時面臨的最大夢魘。一旦跨界，原有的大客戶會感受到嚴重威脅，引發信任危機與抽單報復。"},
  {title:"組織 DNA 的衝突",desc:"B2B 代工思維強調「降低成本、準時交貨、絕對服從」；B2C 品牌思維強調「創新設計、消費者洞察、情感行銷」。同一家公司極難同時具備這兩種矛盾的文化。"},
  {title:"策略的取捨 (Trade-offs)",desc:"策略的本質在於「選擇不做什麼」。伸興選擇克制賺取終端品牌利潤的誘惑，堅守代工本分，換取了全球大廠絕對的信任與壟斷性的市佔率。"}
],
m5_terms:[
  {front:"Original Brand Manufacturing (OBM)\n自有品牌製造",back:"企業不僅負責產品的設計與製造，更建立自己的品牌，直接向終端消費者行銷與銷售的商業模式。"},
  {front:"Channel Conflict\n通路衝突",back:"當企業試圖擴展新的銷售管道（如代工廠自創品牌直銷），而與現有的重要合作夥伴或客戶產生直接利益競爭與摩擦的現象。"},
  {front:"Smiling Curve\n微笑曲線",back:"描述產業價值鏈中各環節附加價值的 U 型曲線模型，指出研發與行銷利潤豐厚，而中間的製造組裝利潤最微薄。"}
],
m5_q:[
  {q:"根據「微笑曲線」理論，製造代工業（如縫紉機組裝）通常面臨什麼樣的產業宿命？",opts:["擁有最高的附加價值與利潤率","位於價值鏈的底部，進入障礙相對較低，競爭激烈且毛利率微薄","品牌知名度極高","完全不需要控制成本"],ans:1,exp:"微笑曲線顯示組裝製造是利潤最薄的一環，企業必須靠極致的成本控制與海量規模才能獲利。"},
  {q:"當一個強大的代工廠 (OEM) 決定推出「自有品牌」(OBM) 產品直接賣給消費者時，最容易引發哪一種毀滅性的策略危機？",opts:["規模經濟的喪失","與現有大客戶發生嚴重的「通路衝突」(Channel Conflict)，導致客戶不滿並大幅抽單","員工集體罷工","政府反對"],ans:1,exp:"客戶找你代工是基於信任。一旦你自創品牌，客戶會認為你利用他們的設計與市場數據來對付他們，必然會轉單防範。"},
  {q:"代工廠轉型品牌商，除了通路衝突外，在「組織能力」上面臨的最大障礙是什麼？",opts:["沒有足夠的工廠","代工的 DNA 是「嚴控成本與紀律」，而品牌的 DNA 是「行銷創意與消費者洞察」，兩者需要截然不同的核心能耐與企業文化","無法生產出產品","銀行不借錢"],ans:1,exp:"會做頂級產品不等於會賣產品。B2B 的工程師文化很難無縫切換到 B2C 的消費者行銷文化。"},
  {q:"伸興選擇不去創立自有縫紉機品牌與大客戶（如 Singer）正面對決，而是去併購車用零件廠。這展現了策略管理的哪個核心原則？",opts:["多角化一定會失敗","策略的本質在於「取捨」(Trade-offs)；放棄部分誘惑，以鞏固在代工本業中無可取代的信任與霸主地位","不要投資研發","完全依賴直覺"],ans:1,exp:"Michael Porter 強調，策略就是選擇不做什麼。伸興捨棄了品牌的溢價誘惑，換取了全球代工市場的絕對壟斷。"},
  {q:"若伸興為了避免通路衝突，但仍想跨足終端品牌，最安全的策略路徑可能是？",opts:["直接推出與客戶一模一樣的產品並低價競爭","利用現有的精密製造能力，自創與原客戶「完全不同產業」的品牌（例如掃地機器人品牌）","把現有客戶全部買下來","偷偷賣瑕疵品給客戶"],ans:1,exp:"只要新品牌不與現有代工客戶的產品線重疊（非直接競爭），就能在不觸發通路報復的情況下，測試 B2C 市場。"}
],

m0_title:"Strategy Analysis of Zeng Hsing Industrial",
m0_intro:"Zeng Hsing is the world's largest contract manufacturer of household sewing machines, commanding over 30% of global market share—a classic Taiwanese 'Hidden Champion'. This module explores how Zeng Hsing built its moat through extreme economies of scale and deep vertical integration, and how it navigates industry maturity via early global footprint shifting (China Plus One to Vietnam) and M&A diversification (into auto parts).",
m0_why:"Why study Zeng Hsing's Corporate Strategy?",

m1_nav:"1. Scale & Champion",m1_title:"Hidden Champions & Economies of Scale",
m1_p1:"Founded in 1968 as a small parts factory in Taichung, Zeng Hsing not only defeated Japanese giants but became the absolute hegemon in household sewing machine OEM (over 30% market share). Firms that focus on highly niche B2B markets, remain unknown to the general public, yet command global pricing power are termed 'Hidden Champions' by German scholar Hermann Simon.",
m1_p2:"\"In traditional manufacturing, when your output is multiples of your competitors, your procurement and depreciation costs become an insurmountable moat.\"",
m1_p3:"Zeng Hsing's foundation is a classic 'Cost Leadership Strategy'. By taking massive ODM orders from global top brands like Singer and Bernina, it achieved profound 'Economies of Scale'. This allows it to procure raw materials and amortize tooling costs at unit prices far lower than rivals.",
m1_p4:"Furthermore, sewing machines require complex precision mechanical assembly. Decades of massive production volumes put Zeng Hsing far ahead on the 'Experience Curve'. The yield control and process optimization accumulated through 'Learning-by-doing' constitute formidable barriers to entry.",
m1_cards:[
  {title:"Hidden Champion",desc:"Focusing on a specific niche market. Despite low public awareness, they hold top-three global market shares, possessing deep technological moats and irreplaceability."},
  {title:"Double-edged Sword of Scale",desc:"Massive volumes bring incredibly low average unit costs, deterring price wars. But high reliance on scale means if a major client pulls orders, fixed depreciation costs will instantly devour profits."},
  {title:"Experience Curve",desc:"As cumulative production doubles, unit value-added costs decline systematically. With millions of units assembled, Zeng Hsing achieved ultimate production efficiency."},
  {title:"ODM (Original Design Mfg)",desc:"Unlike pure OEM, Zeng Hsing possesses strong R&D capabilities. This raises clients' 'Switching Costs', making global brands extremely hesitant to change suppliers."}
],
m1_terms:[
  {front:"Hidden Champion",back:"A concept by Hermann Simon denoting mid-sized, highly specialized companies holding top global market shares in niche B2B markets, typically unknown to the public."},
  {front:"Economies of Scale",back:"The cost advantage obtained due to size, output, or scale of operation, with cost per unit of output decreasing with increasing scale as fixed costs are spread out."},
  {front:"Experience Curve",back:"The phenomenon where unit costs systematically decline as cumulative production volume increases, driven by process improvements and labor learning-by-doing."}
],
m1_q:[
  {q:"Zeng Hsing is known as a 'Hidden Champion'. What characterizes such firms?",opts:["Consumer brands spending heavily on TV ads","Firms with leading global market share in highly niche B2B/specialized markets, but low public awareness","Conglomerates spanning dozens of unrelated industries","Startups with only a few employees"],ans:1,exp:"Hidden champions focus on hyper-segmented markets (like household sewing machines), quietly earning high margins and controlling key nodes of global supply chains."},
  {q:"Zeng Hsing can produce sewing machines at lower average costs than rivals due to its massive order volume. What economic principle does this demonstrate?",opts:["Economies of Scope","Economies of Scale","Network Externalities","Disruptive Innovation"],ans:1,exp:"Larger output allows massive fixed costs (like molds and factories) to be spread thinner over each unit, providing a cost leadership advantage."},
  {q:"In Porter's generic strategies, dominating the global OEM market through ultimate manufacturing efficiency and scale belongs to which strategy?",opts:["Differentiation","Cost Leadership","Unrelated Diversification","Blue Ocean Strategy"],ans:1,exp:"Zeng Hsing's core competitiveness is providing high-quality OEM services at costs rivals cannot match—classic Cost Leadership."},
  {q:"What is the strategic effect of Zeng Hsing upgrading from pure OEM to ODM (collaborative design)?",opts:["Makes it easier for clients to switch suppliers","Increases clients' 'Switching Costs', enhancing customer stickiness and Zeng Hsing's bargaining power","Lowers Zeng Hsing's gross margins","No effect at all"],ans:1,exp:"When a contract manufacturer controls the underlying design and patents, brands face massive redesign and integration costs if they try to switch to a new supplier."},
  {q:"What is the greatest strategic significance of the 'Experience Curve' for a traditional precision manufacturer like Zeng Hsing?",opts:["Accumulating tacit 'learning-by-doing' process knowledge and yield advantages that rivals cannot simply buy with money in the short term","Making employees older","Increasing carbon footprint","Making machines break faster"],ans:0,exp:"Assembling complex machines requires immense tacit know-how. Tens of millions of accumulated units give Zeng Hsing an experiential moat that new entrants cannot bypass."}
],

m2_nav:"2. Vertical Integration",m2_title:"Vertical Integration & Transaction Costs",
m2_p1:"A sewing machine comprises hundreds of precision metal and plastic parts. Historically, Taiwanese assembly plants relied on external satellite factories (die-casting, painting, injection molding). Zeng Hsing, however, adopted a high degree of 'Backward Vertical Integration'.",
m2_p2:"Zeng Hsing built its own aluminum die-casting and plastic injection plants, and even manufactures the highly critical 'shuttle hook' internally. Why 'Make' instead of 'Buy' from external suppliers?",
m2_p3:"From a 'Transaction Cost Economics (TCE)' perspective, when supplier quality is unstable, delivery times are unreliable, or the market has few monopolistic suppliers, the 'friction costs' of market exchange become exorbitant. Furthermore, opening specific molds for Zeng Hsing represents highly 'Transaction-Specific Assets', triggering the 'Hold-up Problem'—where suppliers might extort price hikes.",
m2_p4:"By 'internalizing' key components, Zeng Hsing eliminated the negotiation and monitoring costs of external transactions, ensuring ultimate delivery flexibility and yield control. While this deep vertical integration burdens the firm with heavy fixed assets, it also erects massive capital and technical barriers that deter new entrants.",
m2_cards:[
  {title:"Backward Vertical Integration",desc:"Extending the value chain upstream toward raw materials/components. By building its own die-casting plants, Zeng Hsing reclaimed profits and control from suppliers."},
  {title:"The Hold-up Problem",desc:"When transactions require 'specific assets' (e.g., custom molds), the investing party cannot easily repurpose them, making them vulnerable to extortion. Internalization is the ultimate fix."},
  {title:"Transaction Cost Economics (TCE)",desc:"Theory by Coase and Williamson. Firms choose to 'Make' when the 'transaction costs' of market exchange (searching, negotiating, monitoring) exceed the 'administrative costs' of internal coordination."},
  {title:"Flexibility vs. Cost Trade-off",desc:"Vertical integration guarantees quality and lead times but locks massive capital into hardware. If industry tech shifts rapidly, highly integrated firms often lack strategic flexibility to pivot."}
],
m2_terms:[
  {front:"Backward Vertical Integration",back:"A firm extending its value chain upstream toward suppliers, manufacturing components internally that were previously purchased externally."},
  {front:"Hold-up Problem",back:"The risk that one party, after making a transaction-specific investment, gets opportunistically exploited by the other party due to mutual dependence and sunk costs."},
  {front:"Transaction Costs",back:"Friction costs incurred when using the market mechanism for exchange, including search, negotiation, contracting, and monitoring costs."}
],
m2_q:[
  {q:"Zeng Hsing building its own die-casting and plastic injection plants to avoid relying on external suppliers is called what in corporate strategy?",opts:["Forward Integration","Backward Integration","Horizontal M&A","Unrelated Diversification"],ans:1,exp:"Extending the value chain upstream to manufacture one's own inputs/components is backward vertical integration."},
  {q:"According to 'Transaction Cost Economics (TCE)', what is the core reason Zeng Hsing chose to 'Make' key components rather than 'Buy' them?",opts:["Because internal administrative coordination costs were lower than the market's transaction costs (searching, negotiating, mitigating hold-up risks)","Because doing it yourself is always cheaper","To increase government taxes","To give employees more busywork"],ans:0,exp:"TCE argues firm boundaries are determined by the tug-of-war between internal administrative costs and external market friction. When market friction is too high, internalize."},
  {q:"When Zeng Hsing asks a supplier to develop a highly specific custom mold for its machines, what risk does the supplier fear that might drive up the price?",opts:["Exchange rate risk","Hold-up Risk, because the mold is a highly 'Specific Asset' that cannot be easily sold to other clients","Climate change risk","Brand extension risk"],ans:1,exp:"Specific asset investments create sunk costs, putting the investor at a bargaining disadvantage later (vulnerable to hold-up), causing market mechanisms to fail."},
  {q:"While ensuring quality and lead times, what is the primary potential disadvantage of deep vertical integration?",opts:["Massive brand awareness","Massive fixed asset investments cause the firm to lose 'strategic flexibility', facing heavy depreciation burdens during economic downturns","Eliminates the need for supply chain management","Automatically grants government subsidies"],ans:1,exp:"Vertical integration makes a firm 'asset-heavy'. When demand drops or technology shifts, heavy machinery and factories become massive obstacles to pivoting."},
  {q:"Internalizing the manufacturing of highly critical core components (like the shuttle hook) serves what crucial strategic purpose beyond lowering transaction costs?",opts:["To pivot into real estate","To strictly protect core process Intellectual Property (IP) and tacit knowledge, preventing tech spillage from breeding future competitors","To increase carbon emissions","None at all"],ans:1,exp:"Keeping the most complex and secretive components inside your own factory is a key defense mechanism to maintain tech barriers against suppliers or ex-employees."}
],

m3_nav:"3. Global Footprint",m3_title:"Global Footprint & CAGE Distance",
m3_p1:"In the early 2000s, while most Taiwanese traditional manufacturers blindly flocked to Mainland China seeking cheap labor, Zeng Hsing's management made a highly visionary decision: setting up factories in Vietnam. They were pioneers of the 'China Plus One' strategy long before it became a buzzword.",
m3_p2:"Firms undertake Foreign Direct Investment (FDI) for various motives. Moving to Vietnam was a classic 'Efficiency-seeking' motive. As coastal Chinese wages skyrocketed, Vietnam offered superior 'Location Advantages'—an abundant, young, and cheap workforce.",
m3_p3:"Global trade regulations were also key drivers. The EU imposed anti-dumping tariffs on certain Chinese products, while Vietnam enjoyed Generalized System of Preferences (GSP) tariff benefits. By shifting production bases, Zeng Hsing brilliantly executed 'Regulatory Arbitrage'.",
m3_p4:"However, cross-border expansion inevitably encounters Ghemawat's 'CAGE Distances'. Early on in Vietnam, Zeng Hsing faced immense 'Administrative distance' (red tape) and 'Cultural distance' (managing local labor and strikes). Overcoming this 'Liability of Foreignness' incurred high learning costs, but once mastered, this transnational management capability became a competitive moat impossible for latecomers to replicate.",
m3_cards:[
  {title:"Efficiency-seeking",desc:"A primary motive for FDI. Seeking locations with the lowest global factor costs (labor, land) to configure labor-intensive production stages, maximizing cost leadership."},
  {title:"China Plus One Strategy",desc:"To diversify geopolitical and economic risks associated with over-concentrating in China (wage hikes, trade wars), MNCs establish a secondary production base elsewhere (e.g., SE Asia)."},
  {title:"Regulatory Arbitrage",desc:"One of Ghemawat's AAA global strategies. Profiting by exploiting (rather than overcoming) differences in factor prices, taxes, or trade regulations between countries."},
  {title:"Liability of Foreignness",desc:"The extra friction costs foreign firms face initially compared to domestic firms, stemming from unfamiliarity with local culture, laws, language, and business networks."}
],
m3_terms:[
  {front:"Foreign Direct Investment (FDI)",back:"A firm crossing borders to make a capital investment in foreign physical production facilities over which it exercises substantial control (like building a factory in Vietnam)."},
  {front:"CAGE Framework",back:"An analytical framework measuring bilateral market friction across four dimensions: Cultural, Administrative, Geographic, and Economic distances."},
  {front:"Regulatory Arbitrage",back:"A strategy where firms exploit differences in laws, tax codes, or environmental/labor regulations across borders to reduce costs or increase profits."}
],
m3_q:[
  {q:"What was the primary internationalization motive for Zeng Hsing moving massive capacity from Taiwan/China to Vietnam early on?",opts:["Market-seeking (selling machines to Vietnamese locals)","Strategic Asset-seeking (acquiring Vietnamese tech firms)","Efficiency-seeking (utilizing young, cheap labor to lower manufacturing costs)","Resource-seeking"],ans:2,exp:"Sewing machine assembly is labor-intensive. Moving factories to lower-wage Vietnam is a textbook 'efficiency-seeking' move to maintain cost leadership."},
  {q:"Using Vietnam to export to the EU to enjoy lower/zero GSP tariffs is termed what in global strategy?",opts:["Cultural Adaptation","Regulatory Arbitrage","Global Aggregation","Unrelated Diversification"],ans:1,exp:"Exploiting tax or regulatory discrepancies between countries to capture margins or lower costs is Ghemawat's 'Arbitrage' strategy."},
  {q:"During early Vietnam expansion, Zeng Hsing faced strikes and difficulties managing local staff. In the CAGE framework, this primarily reflects friction from which distance?",opts:["Economic distance","Cultural distance (differences in labor values, management styles, and communication)","Geographic distance","Virtual distance"],ans:1,exp:"Differences in how authority, work ethics, and communication are perceived across borders represent the hardest-to-overcome 'Cultural distance'."},
  {q:"What does the 'Liability of Foreignness' imply for multinational corporations?",opts:["Foreign firms are always welcomed by local consumers","They must initially bear higher learning and operational friction costs than local firms due to unfamiliarity with host country laws and culture","They are tax-exempt","They will inevitably fail"],ans:1,exp:"It is the universal growing pain of FDI. MNCs must rely on strong 'Ownership Advantages' (e.g., superior tech or management capabilities) to offset these extra costs."},
  {q:"Why have many global manufacturers recently emulated Zeng Hsing's 'China Plus One' strategy?",opts:["Because the Chinese market disappeared","To diversify the extreme geopolitical risks and wage pressure of concentrating solely in one country, building 'Supply Chain Resilience'","Because of climate change in China","To increase their carbon footprint"],ans:1,exp:"While hyper-concentrating in one country maximizes scale economies, it carries fatal risks during trade wars or lockdowns. Dispersing locations buys insurance (resilience)."}
],

m4_nav:"4. M&A Diversification",m4_title:"Diversification M&A & Synergies",
m4_p1:"Household sewing machines represent a highly mature industry with slow global growth. When a firm hits a growth ceiling in its core business, it often initiates a 'Diversification' strategy to find a second curve.",
m4_p2:"Recently, Zeng Hsing chose to step into entirely new domains via 'Mergers and Acquisitions (M&A)'. The most notable case is acquiring 'Eurocharm' (a precision metal machining firm supplying global auto giants like Bosch).",
m4_p3:"On the surface, sewing machines and auto parts seem unrelated. However, through the lens of 'Economies of Scope', this is a brilliant 'Related Diversification'. Zeng Hsing's die-casting tech and Eurocharm's precision machining share a deeply overlapping 'manufacturing engineering and management logic' (Strategic Relatedness).",
m4_p4:"This M&A intended to create multiple 'Synergies': (1) Revenue Synergy: Zeng Hsing leverages Eurocharm's strict automotive certifications and channels to push its own precision parts into the high-margin auto supply chain; (2) Cost Synergy: Joint raw material procurement enhances bargaining power; (3) Internal Capital Market: Zeng Hsing's massive, stable 'Cash Cow' flows from sewing machines can fund Eurocharm's capital-intensive global factory expansions.",
m4_cards:[
  {title:"Related Diversification",desc:"Entering a new business that shares significant value chain commonalities (tech, manufacturing, channels) with the core business. Both machines and auto parts rely on 'precision metal manufacturing' logic."},
  {title:"Synergy",desc:"The magic of 1+1>2. Post-merger, sharing procurement (Cost Synergy) and cross-selling into each other's supply chains (Revenue Synergy) creates value impossible to achieve standalone."},
  {title:"Escaping Mature Industries",desc:"When the core industry enters a mature/decline lifecycle phase, a firm must channel the free cash flow extracted from it (Cash Cow) into new, high-potential industries (Stars)."},
  {title:"M&A Risks (PMI)",desc:"The biggest challenge in stepping into new domains is 'Post-Merger Integration'. Getting executives from different corporate cultures to drop biases and actually share resources dictates success or failure."}
],
m4_terms:[
  {front:"Related Diversification",back:"Expanding into new markets that share substantive links with the existing core business in value chain activities, enabling economies of scope."},
  {front:"Synergy",back:"The additional value generated when two businesses integrate, exceeding the sum of their standalone values, via resource sharing or capability transfer."},
  {front:"Post-Merger Integration (PMI)",back:"The arduous process of physically and culturally fusing two companies' operations and personnel after a deal closes to realize expected synergies."}
],
m4_q:[
  {q:"Facing slow sewing machine market growth, Zeng Hsing acquired Eurocharm to enter automotive precision machining. What growth strategy is this?",opts:["Horizontal M&A (buying a competitor)","Vertical Integration","Related Diversification (entering a new industry sharing underlying technical commonalities)","Unrelated Diversification (e.g., entering food service)"],ans:2,exp:"Both rely heavily on the core capability of 'precision metal manufacturing and quality control', thus making it related diversification."},
  {q:"What is the core prerequisite for diversification M&A to create shareholder value? (Porter's Better-off Test)",opts:["Must spend a lot of cash","The merged entity must create 'Synergies' (cost savings or cross-selling) impossible to generate independently","Must fire half the staff","Must buy a foreign company"],ans:1,exp:"If M&A generates no real resource complementarity or capability transfer (1+1>2), shareholders could simply buy Eurocharm stock themselves; they don't need Zeng Hsing to do it."},
  {q:"Zeng Hsing has die-casting tech; Eurocharm has stringent certifications and channels into European automakers (like Bosch). Combining them hopes to generate which synergy?",opts:["Financial arbitrage synergy","Revenue Synergy (pushing Zeng Hsing parts into auto markets via Eurocharm channels)","Layoff synergy","Tax evasion synergy"],ans:1,exp:"Integrating complementary 'tech' and 'market channels' to jointly sell more products to new clients is classic revenue synergy."},
  {q:"In BCG Matrix logic, Zeng Hsing uses cash generated from sewing machines (slow growth, high share, cash rich) to acquire and fund the high-growth auto parts business. What is this?",opts:["Funding a 'Question Mark' with a 'Dog'","Using 'Cash Cow' flows to nurture future 'Stars' or 'Question Marks'","Giving 'Star' money to 'Dogs'","Zero investment"],ans:1,exp:"Mature cash cows serve as the corporate bank. The essence of portfolio management is funneling cow cash into high-growth ventures that will become the next generation of cows."},
  {q:"What is usually the fatal 'non-financial' flaw that causes M&As in new domains to fail?",opts:["The company names have different letter counts","Failure in 'Post-Merger Integration (PMI)', involving severe culture clashes, power struggles, and loss of core talent","Paying too much","Government rejection"],ans:1,exp:"Buying the firm is just step one. Getting two distinct groups of people to break down silos and actually share resources is the hardest hurdle in realizing synergy."}
],

m5_nav:"5. Smiling Curve Dilemma",m5_title:"The Smiling Curve Dilemma: OEM vs OBM",
m5_p1:"Manufacturing often faces the 'Smiling Curve' dilemma: R&D and Branding at the two ends hold the highest value-added, while manufacturing/assembly in the middle faces brutal competition and razor-thin margins. As the global OEM hegemon, Zeng Hsing has maximized profitability on the manufacturing end.",
m5_p2:"To capture brand premiums, many OEMs dream of launching 'Original Brand Manufacturing (OBM)'. The logic seems simple: 'Since I design and make everything, why not stick my own logo on it and capture the fat retail margins?'",
m5_p3:"However, transitioning from OEM to OBM is a treacherous path. The most fatal blow is 'Channel Conflict'. The moment an OEM launches its own brand, it morphs from a 'trusted partner' into a 'direct competitor' to its clients. This violates the cardinal rule of contract manufacturing. Major clients (like Singer) will ruthlessly pull orders to prevent market cannibalization and tech leakage.",
m5_p4:"Furthermore, an OEM's organizational DNA is 'cost control, efficiency, and obedience', while a Brand requires 'marketing, consumer psychology, and flexible tolerance for error'. The required core competencies and cultures are fundamentally opposed. Thus, Zeng Hsing has been extremely cautious regarding OBM, choosing instead to expand via upstream integration or M&A in adjacent industries, avoiding frontal assaults on its long-standing clients.",
m5_cards:[
  {title:"The Smiling Curve",desc:"Concept by Stan Shih. In an industry value chain, value-added forms a U-shape. Left is R&D/patents, right is brand/services, bottom is assembly. Manufacturing gets squeezed hardest."},
  {title:"Channel Conflict",desc:"The ultimate nightmare when an OEM transitions to a brand. Crossing the line makes existing major clients feel severely threatened, triggering trust crises and retaliatory order cancellations."},
  {title:"Clash of Organizational DNA",desc:"B2B OEM thinking emphasizes 'cutting costs, on-time delivery, absolute execution'. B2C brand thinking emphasizes 'innovative design, consumer insight, emotional marketing'. Mixing these two cultures under one roof is incredibly difficult."},
  {title:"Strategic Trade-offs",desc:"The essence of strategy is 'choosing what NOT to do'. Zeng Hsing chose to resist the temptation of terminal brand profits, steadfastly sticking to its OEM role, thereby securing the absolute trust of global brands and a monopolistic market share."}
],
m5_terms:[
  {front:"Original Brand Manufacturing (OBM)",back:"A business model where a firm not only designs and manufactures but also builds its own brand to market and sell directly to end consumers."},
  {front:"Channel Conflict",back:"Friction and retaliation that occur when a firm expands into new sales channels (like an OEM launching a direct-to-consumer brand) that compete directly with its existing partners or clients."},
  {front:"Smiling Curve",back:"A U-shaped model describing the value-added across an industry value chain, indicating that R&D and marketing are highly profitable, while mid-stream assembly is the least."}
],
m5_q:[
  {q:"According to the 'Smiling Curve', what is the typical destiny of a pure contract manufacturer (like sewing machine assembly)?",opts:["Holding the highest value-added and profit margins","Located at the bottom of the value chain with relatively low entry barriers, intense competition, and razor-thin gross margins","Extremely high brand awareness","Zero need for cost control"],ans:1,exp:"The curve shows assembly is the thinnest margin slice, forcing firms to rely on extreme cost control and massive volume to survive."},
  {q:"When a powerful OEM decides to launch its own 'OBM' products directly to consumers, what devastating strategic crisis is most likely to occur?",opts:["Loss of scale economies","Severe 'Channel Conflict' with existing major clients, leading to anger and massive order cancellations","Employee strikes","Government opposition"],ans:1,exp:"Clients hire OEMs based on trust. Launching a brand makes the client feel you are using their designs and market data against them, guaranteeing retaliatory order pulls."},
  {q:"Beyond channel conflict, what is the biggest 'Organizational Capability' hurdle in transitioning from OEM to Brand?",opts:["Not having enough factories","OEM DNA is 'strict cost control and discipline'; Brand DNA is 'marketing creativity and consumer insight'. They require completely contradictory core competencies and cultures","Inability to physically produce products","Banks won't lend money"],ans:1,exp:"Being able to build a top-tier product does not mean knowing how to sell it. B2B engineering cultures struggle to seamlessly adopt B2C consumer marketing cultures."},
  {q:"Zeng Hsing chose NOT to create its own sewing machine brand to fight its clients (like Singer), but instead acquired an auto parts firm. What core principle of strategic management does this highlight?",opts:["Diversification always fails","Strategy is about 'Trade-offs'; giving up some temptations to solidify irreplaceable trust and dominance in the core OEM business","Never invest in R&D","Rely purely on intuition"],ans:1,exp:"Michael Porter emphasizes strategy is choosing what not to do. Abandoning the brand premium temptation secured Zeng Hsing's absolute monopoly in the global OEM market."},
  {q:"If Zeng Hsing wanted to enter the B2C terminal market while avoiding channel conflicts with its sewing machine clients, what is the safest strategic path?",opts:["Launch exact replicas of client products at lower prices","Leverage its precision manufacturing capabilities to create an own-brand in a 'completely different industry' (e.g., robotic vacuums)","Buy out all existing clients","Secretly sell defective goods to clients"],ans:1,exp:"As long as the new brand does not overlap with the product lines of existing OEM clients (no direct competition), it can test the B2C waters without triggering channel retaliation."}
],

/* ═══════ FLIP CARD ═══════ */
const FlipCard = ({ front, back, t }) => {

    <div className="perspective cursor-pointer h-36 select-none" onClick={() => setFlipped(!flipped)}>
      <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped ? 'rotate-y-180' : ''}`}>

/* ═══════ MODULE QUIZ ═══════ */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [quizIndices] = useState(() =>
    [...Array(questions.length).keys()].sort(() => Math.random() - 0.5).slice(0, 4)
  );
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700 select-none">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-6 flex items-center"><IconBookOpen size={20} className="mr-2"/>{t.quiz_title}</h3>
      {quizIndices.map((qIdx, i) => {
        const q = questions[qIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3 text-slate-800 dark:text-slate-200">{i+1}. {q.q}</p>
            <div className="space-y-2">
              {q.opts.map((opt, oIdx) => (
                <button key={oIdx} onClick={() => !submitted && setSelected(s => ({...s, [i]: oIdx}))}
                  className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                    ${submitted
                      ? oIdx === q.ans ? 'bg-green-100 border-green-500 dark:bg-green-900/30 dark:border-green-500 font-bold'
                        : selected[i] === oIdx ? 'bg-red-100 border-red-400 dark:bg-red-900/30 dark:border-red-400 text-red-600' : 'border-slate-200 dark:border-slate-700'
                      : selected[i] === oIdx ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/5 font-bold text-[#004030] dark:text-[#D8C3A5]' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'
                    } text-slate-700 dark:text-slate-300`}>
                  {opt}
                </button>
              ))}
            </div>
            {submitted && <p className="mt-2 text-sm text-slate-600 dark:text-slate-400 italic">{t.explanation}: {q.exp}</p>}
          </div>
        );
      })}
      {!submitted ? (
        <button onClick={() => { 
            setSubmitted(true); 
            const c = quizIndices.filter((qIdx,i) => selected[i] === questions[qIdx].ans).length; 
            onQuizSubmit(moduleId, c, quizIndices.length, questions.length); 
          }}
          disabled={Object.keys(selected).length < quizIndices.length}
          className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40 transition-all">
          {t.submit}
        </button>
      ) : (
        <div className="flex items-center gap-4">
          <p className="font-bold text-[#004030] dark:text-[#D8C3A5]">{t.score}: {quizIndices.filter((qIdx,i) => selected[i] === questions[qIdx].ans).length}/{quizIndices.length}</p>
          <button onClick={() => { setSelected({}); setSubmitted(false); }}
            className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg hover:bg-[#004030]/10 transition-colors">
            {t.retry}
          </button>
        </div>
      )}
    </div>
  );
};
