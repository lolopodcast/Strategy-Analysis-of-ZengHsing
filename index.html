      if (

        (e.ctrlKey && (e.key === 's' || e.key === 'S')) ||

        e.preventDefault();
      }
    };

    document.addEventListener('selectstart', preventDefault);
    document.addEventListener('dragstart', preventDefault);

      document.removeEventListener('contextmenu', preventDefault);

    content: {
      en: "Welcome to the Strategic Analysis Report of ZengHsing Industrial (ZH). This comprehensive research platform aims to deeply dissect the strategic evolution of ZH, the undisputed global leader in household sewing machine ODM. Through a systematic structural analysis rooted in strategic management frameworks (TP0 to TP3 modules), we will critically evaluate ZH's macro-environmental challenges, internal resource orchestration, dynamic capabilities, and its overarching corporate strategies including upstream vertical integration and non-related diversification (prominently through the acquisition of Yulon Tech).\n\nIn recent years, the macroeconomic landscape has presented severe headwinds: inflationary pressures in European and American markets have significantly dampened consumer purchasing power for durable goods like sewing machines, while the post-pandemic normalization has eroded the temporary 'DIY home economy' boom. Faced with a maturing core industry and revenue growth bottlenecks (evidenced by a YoY revenue decline of 2.8% and EPS drop of 18.94% in recent fiscal periods), ZH's management proactively initiated a profound 'Dual-Axis' transformation strategy.\n\nThis research platform encapsulates these strategic maneuvers into five core themes. It features interactive concept cards, situational knowledge quizzes, and a dynamic resource allocation lab to help researchers internalize complex business strategy theories. By navigating through this report, researchers will gain profound insights into how a traditional manufacturing titan overcomes organizational inertia, navigates the China+1 global supply chain shifts, and integrates high-tech precision manufacturing to forge a sustainable second curve of growth.",

        { q: {en: "What type of integration does the acquisition of Yulon Tech represent?", tw: "伸興併購宇隆科技的策略，在企業擴張理論中屬於何種類型？"}, options: {en: ["Upstream Vertical Integration", "Horizontal Integration", "Non-related Diversification", "Market Penetration"], tw: ["向上游垂直整合 (Upstream Vertical Integration)", "水平整合 (Horizontal Integration)", "非相關多角化 (Non-related Diversification)", "市場滲透 (Market Penetration)"]}, ans: 2 }

    {
      id: 2,

      title: { en: "2. Value Chain & Resource Allocation", tw: "2. 價值活動鏈與資源盤點" },
      highlights: {

        tw: ["多構面矩陣型組織架構", "台灣研發樞紐與越南量產基地", "供應鏈高度垂直整合與自製率"]
      },
      description: {
        en: "To operationalize its global strategy, ZH has architected a sophisticated multi-dimensional organizational structure. This structure efficiently manages Value Chain activities across borders. At its core, the Taiwan headquarters functions as the 'Brain' (Functional Units - FU), governing strategic foresight, high-end R&D (including 'Green Sewing Machine' innovations), and global financial consolidation. Conversely, Geographic Units (GU) are deployed to optimize operational efficiency, with Vietnam serving as the primary muscle, accounting for a staggering 91% of total manufacturing capacity. Business Units (BU) maintain operational clarity by keeping the traditional sewing division distinct from the newly acquired Yulon precision metal subsidiary.\n\nAnalyzing Porter's Value Chain, ZH's Inbound Logistics are characterized by an exceptionally high component self-sufficiency rate. By establishing a deeply integrated, localized supply chain within Vietnam, ZH effectively mitigates tariff exposures (dodging US-China trade war fallout) and drastically reduces cross-border transportation risks. In Operations, the sewing division relentlessly pursues economies of scale and one-stop automation to crush costs, whereas Yulon invests heavily in Smart Factories to guarantee micrometer-level precision for AI and automotive clients.\n\nOn the outbound and marketing fronts, ZH excels in B2B relationship management. The sewing division has cemented irreplaceable, decades-long ODM partnerships with iconic global brands (like Singer and Bernina). Meanwhile, Yulon circumvents middlemen, acting as a Tier-1 or Tier-2 supplier directly to global automotive giants (like Bosch) and robotics innovators, ensuring robust margins and deep integration into clients' product development cycles.",
        tw: "為了落實其全球化策略，伸興建構了一套精密的「多構面矩陣型組織架構」，以跨國界高效率地管理其價值鏈活動。在核心配置上，台灣總部扮演了「大腦」的角色（功能部門 FU），專責統籌集團策略願景、高階研發（例如「綠色縫紉機」的創新設計）以及全球財務調度。相對地，地理市場部門 (GU) 則被用來極大化營運效率，其中越南廠區作為集團的「肌肉」，承擔了高達 91% 的總產能。此外，事業單位 (BU) 的劃分確保了營運的清晰度，將傳統縫紉機事業部與新併購的宇隆精密金屬子公司進行專業分工。\n\n深入剖析波特 (Michael Porter) 的價值鏈模型，伸興在「進料後勤 (Inbound Logistics)」上展現了極高的零件自製率。透過在越南當地建立深度整合的在地化供應鏈，伸興不僅有效規避了中美貿易戰帶來的關稅曝險，更大幅降低了跨國運輸的中斷風險。在「生產營運 (Operations)」方面，縫紉機本業無情地追求規模經濟與一條龍自動化以極致壓縮成本；而宇隆則投入鉅資打造智慧工廠，以確保 AI 與車用客戶所需的微米級極致精密度。\n\n在出貨後勤與行銷銷售端，伸興是 B2B 關係管理的佼佼者。縫紉機部門與全球百年經典品牌（如勝家 Singer、伯妮娜 Bernina）建立了長達數十年、無可取代的 ODM 夥伴關係。同時，宇隆則跳過中間商，直接作為 Tier-1 或 Tier-2 供應商，為全球汽車巨頭（如 Bosch）與機器人創新企業供貨，這不僅確保了豐厚的毛利，更讓集團能深度參與客戶的早期產品開發週期。"
      },
      wrapUp: {
        en: "By geographically decoupling strategy/R&D (Taiwan) from mass execution (Vietnam), and securing the supply chain locally, ZH maximizes value capture while minimizing systemic risks.",
        tw: "透過將策略研發（台灣）與大規模量產（越南）進行地理上的策略性脫鉤，並在當地鞏固供應鏈，伸興在極大化價值獲取的同時，將系統性營運風險降至最低。"
      },
      cards: [
        { term: {en:"Value Chain", tw:"價值鏈 (Value Chain)"}, def: {en:"A framework detailing the internal activities a firm engages in (primary and support) to create value and competitive advantage.", tw:"波特提出的分析架構，詳述企業為創造價值與競爭優勢所進行的一系列內部活動（主要活動與支援活動）。"} },
        { term: {en:"Component Self-sufficiency", tw:"零件自製率"}, def: {en:"The percentage of parts produced internally rather than outsourced, critical for controlling quality, costs, and avoiding supply shocks.", tw:"企業內部生產而非外部採購的零件比例，對於嚴控品質、成本及避免供應鏈斷鏈衝擊至關重要。"} },
        { term: {en:"Tier-1 Supplier", tw:"一階供應商 (Tier-1)"}, def: {en:"Companies that supply parts or systems directly to the original equipment manufacturer (OEM), bypassing middlemen.", tw:"直接向原廠設備製造商 (OEM) 供應零組件或系統的企業，跳過中間商，擁有較高議價與研發能力。"} },
        { term: {en:"Economies of Scale", tw:"規模經濟"}, def: {en:"The cost advantages that enterprises obtain due to their scale of operation, with cost per unit of output decreasing with increasing scale.", tw:"企業因營運規模擴大、產量增加，導致分攤到單一產品的固定成本下降，進而獲得的單位成本優勢。"} }
      ],
      quizzes: [
        { q: {en: "How did ZH configure its manufacturing footprint to mitigate the risks of the US-China trade war?", tw: "伸興如何配置其生產版圖，以有效降低中美貿易戰帶來的風險？"}, options: {en: ["By moving all production back to Taiwan", "By concentrating 91% of mass production capacity in Vietnam", "By building factories in the United States", "By outsourcing everything to Chinese competitors"], tw: ["將所有的生產線全面撤退回台灣", "將高達 91% 的大規模量產產能集中於越南廠區", "直接在美國本土大量投資興建廠房", "將所有製造環節委外給中國的競爭對手"]}, ans: 1 },
        { q: {en: "In ZH's value chain, what is the primary role of the Taiwan headquarters?", tw: "在伸興的價值鏈配置中，台灣總部主要扮演何種核心角色？"}, options: {en: ["Low-cost mass assembly", "Direct-to-consumer retail storefronts", "Strategic foresight and high-end R&D", "Raw material extraction and mining"], tw: ["低成本的大規模人力組裝", "面對終端消費者的實體零售店面", "統籌集團策略願景與高階研發設計", "基礎原物料的開採與精煉"]}, ans: 2 },
        { q: {en: "What specific operational approach does Yulon take to meet Tier-1 client demands?", tw: "宇隆科技在「生產營運」環節中採取何種具體策略，以滿足全球一階客戶的極致要求？"}, options: {en: ["Using second-hand machines to cut costs", "Investing heavily in Smart Factories for micrometer-level precision", "Hiring only unskilled labor", "Producing only standard, low-tech metal sheets"], tw: ["全面採用二手機器設備以極限壓縮生產成本", "投入鉅資打造智慧工廠，確保微米級的極致精密度", "大量聘僱無技術經驗的臨時工", "僅生產無技術門檻的標準化鐵板"]}, ans: 1 },
        { q: {en: "What is a major benefit of ZH's high 'Component Self-sufficiency' rate in Vietnam?", tw: "伸興在越南廠區維持極高「零件自製率」的主要策略效益為何？"}, options: {en: ["It prevents them from doing business with American clients", "It dramatically increases cross-border transportation risks", "It mitigates tariff exposures and reduces supply shocks", "It forces them to pay higher local taxes"], tw: ["這會導致他們無法承接任何美國客戶的訂單", "這會大幅增加跨國運輸的斷鏈風險", "有效規避關稅曝險並降低供應鏈斷鏈的衝擊", "這會迫使他們繳納更高額的當地企業所得稅"]}, ans: 2 }
      ]
    },
    {
      id: 3,
      icon: IconTarget,
      title: { en: "3. VRIN Competencies & Dynamic Capabilities", tw: "3. VRIN 核心能耐與動態能力" },
      highlights: { 
        en: ["VRIN Validation of Core Resources", "Causal Ambiguity & Social Complexity", "Sensing, Seizing, Transforming"], 
        tw: ["核心資源的 VRIN 檢驗", "因果模糊性與社會複雜性", "感知、掌握與重組的動態能力"]
      },
      description: {
        en: "To determine if ZH's resources constitute a sustainable competitive advantage, we apply the VRIN framework. Analysis confirms three core competencies: (1) An ultra-efficient global manufacturing and supply chain network, (2) Deep-rooted ODM technological integration capabilities, and (3) Yulon's mastery in precision metal processing and advanced reducers. \n\nThese capabilities are definitively 'Valuable' as they continuously generate above-average margins. They are 'Rare' because few competitors boast such an extensive, vertically integrated footprint in Southeast Asia (Vietnam). Most crucially, they are 'Inimitable' (hard to copy) due to Historical Path Dependence and 'Causal Ambiguity'—outsiders cannot easily reverse-engineer the silent know-how and 'Social Complexity' (trust and communication channels) ZH has built with top brands over 40 years. Finally, in the current technological paradigm, these manufacturing integration skills remain largely 'Non-substitutable'.\n\nHowever, static resources perish in turbulent markets; thus, ZH exhibits formidable Dynamic Capabilities (Teece's framework). First, it excels in 'Sensing': management acutely identified the plateauing of the post-pandemic DIY trend and simultaneously recognized the explosive mega-trend in AI and robotics. Second, it acted decisively in 'Seizing' the opportunity: instead of slow organic growth, ZH executed the swift acquisition of Yulon Tech, bypassing entry barriers and immediately rolling out prototype robotic reducers to European and American clients. Finally, ZH is actively 'Transforming': it is reconfiguring its organizational DNA, shifting mass production away from Taiwan, elevating Taiwan to an advanced tech hub, and synthesizing the distinct corporate cultures of traditional mechanics and high-tech precision to form a cohesive, future-ready enterprise.",
        tw: "為了判定伸興的資源是否構成永續的競爭優勢，我們導入 VRIN 分析架構。研究證實伸興具備三項核心能耐：(1) 超高效率的全球化製造與供應鏈網絡、(2) 深厚扎實的 ODM 技術整合能力、(3) 宇隆在精密金屬加工與高階減速機的研發底蘊。\n\n這些能耐絕對具備「價值性 (Valuable)」，因其能源源不絕創造高於產業平均的毛利。它們具備「稀少性 (Rare)」，因為在東南亞（尤其是越南）鮮有競爭對手能建立如此龐大且垂直整合的產能版圖。最關鍵的是，它們「難以模仿 (Inimitable)」，這歸功於歷史路徑依賴與「因果模糊性」——外部競爭者無法輕易逆向工程伸興的隱性知識，也無法複製其 40 多年來與全球頂級品牌建立的「社會複雜性」（深厚的信任基礎與溝通默契）。最後，在當前的技術範式下，這些製造整合能力依然是「不可替代的 (Non-substitutable)」。\n\n然而，靜態資源在動盪市場中終將凋零；為此，伸興展現了強悍的「動態能力 (Dynamic Capabilities)」。首先在「感知 (Sensing)」階段：經營階層敏銳嗅出疫後 DIY 熱潮的觸頂退燒，同時準確辨識出 AI 與機器人產業爆發的大趨勢。其次是果斷「掌握 (Seizing)」機會：伸興沒有選擇緩慢的內部研發，而是迅雷不及掩耳地併購了宇隆科技，直接跨越極高的產業進入障礙，並立即向歐美大廠送樣測試機器人減速機原型。最後，伸興正積極進行「重組 (Transforming)」：持續重塑組織 DNA，將量產重心移出台灣，把台灣廠區升格為先進技術樞紐，並致力於融合傳統機械與高科技精密兩種截然不同的企業文化，打造迎向未來的敏捷企業。"
      },
      wrapUp: {
        en: "Possessing VRIN resources provides the foundation, but ZH's true strategic brilliance lies in its dynamic ability to sense macroeconomic shifts and reconfigure its assets via M&A before obsolescence strikes.",
        tw: "擁有 VRIN 資源僅是穩固了根基，伸興真正的策略卓越之處，在於其動態能力：能在資產過時之前，精準感知總經環境的轉變，並透過併購果斷重組自身能耐。"
      },
      cards: [
        { term: {en:"VRIN Framework", tw:"VRIN 分析架構"}, def: {en:"A strategic tool evaluating if resources are Valuable, Rare, Inimitable, and Non-substitutable to sustain competitive advantage.", tw:"一項嚴謹的策略評估工具，檢驗企業資源是否具備有價值、稀有、難以模仿及不可替代等四項特性，以維持永續競爭優勢。"} },
        { term: {en:"Causal Ambiguity", tw:"因果模糊性"}, def: {en:"A condition where competitors cannot clearly understand the complex causal links between a firm's resources and its superior performance.", tw:"一種策略屏障狀態，指競爭對手難以釐清企業內部複雜資源與其卓越績效之間的明確因果關係，從而無從模仿。"} },
        { term: {en:"Dynamic Capabilities", tw:"動態能力"}, def: {en:"A firm's capacity to continuously integrate, build, and reconfigure internal and external competences to address rapidly changing environments.", tw:"企業為因應快速變動的外部環境，持續整合、建立與重組內外部資源與核心能耐的動態適應能力。"} },
        { term: {en:"Social Complexity", tw:"社會複雜性"}, def: {en:"Interpersonal relations, trust, and culture within and across firms that form a barrier to imitation.", tw:"企業內部團隊間或與外部客戶間，經過長期互動所建立的人際網絡、信任與企業文化，形成難以被輕易複製的模仿障礙。"} }
      ],
      quizzes: [
        { q: {en: "Which VRIN characteristic primarily protects ZH's 40-year relationship with global brands from being easily copied?", tw: "VRIN 架構中的哪一項特性，最主要保護了伸興與全球品牌 40 年深厚關係不被輕易複製？"}, options: {en: ["Valuable", "Rare", "Inimitable (due to Social Complexity)", "Non-substitutable"], tw: ["有價值 (Valuable)", "稀少性 (Rare)", "難以模仿 (源於社會複雜性)", "不可替代 (Non-substitutable)"]}, ans: 2 },
        { q: {en: "Noticing the decline of the DIY sewing trend and the rise of AI robotics belongs to which phase of Dynamic Capabilities?", tw: "敏銳察覺居家 DIY 縫紉趨勢的衰退，並預見 AI 機器人產業的崛起，屬於動態能力中的哪一個階段？"}, options: {en: ["Sensing", "Seizing", "Transforming", "Defending"], tw: ["感知 (Sensing)", "掌握 (Seizing)", "重組 (Transforming)", "防禦 (Defending)"]}, ans: 0 },
        { q: {en: "Executing the acquisition of Yulon Tech rapidly is an example of which Dynamic Capability?", tw: "果斷出手併購宇隆科技以跨越產業進入障礙，這是展現了動態能力中的哪一個階段？"}, options: {en: ["Sensing", "Seizing", "Divesting", "Ignoring"], tw: ["感知 (Sensing)", "掌握 (Seizing)", "剝離 (Divesting)", "忽略 (Ignoring)"]}, ans: 1 },
        { q: {en: "What makes ZH's Vietnam mass production capability 'Rare'?", tw: "是什麼因素讓伸興在越南的大規模量產能力具備 VRIN 中的「稀少性 (Rare)」？"}, options: {en: ["Because it's illegal to build factories in Vietnam", "Few competitors have built such an extensive, vertically integrated footprint in SE Asia", "Because sewing machines are no longer needed globally", "Vietnam is the only country with electricity"], tw: ["因為在越南建造工廠是非法的行為", "在東南亞幾乎沒有競爭對手能建立如此龐大且垂直整合的產能版圖", "因為全球已經完全不需要縫紉機了", "因為越南是東南亞唯一擁有電力的國家"]}, ans: 1 }
      ]
    },
    {
      id: 4,
      icon: IconShield,
      title: { en: "4. Corporate Strategy: Integration & Diversification", tw: "4. 集團策略：垂直整合與多角化" },
      highlights: { 
        en: ["Transaction Cost Economics (TCE)", "Unrelated Diversification Logic", "BCG Growth-Share Matrix Analysis"], 
        tw: ["交易成本理論 (TCE) 深度視角", "非相關多角化的避險與成長邏輯", "BCG 波士頓矩陣策略定位"]
      },
      description: {
        en: "Elevating our analysis to the Corporate Strategy level, we examine how ZH defines the scope of its enterprise. In its core sewing business, ZH aggressively pursues Upstream Vertical Integration (Organic Growth). We analyze this through the lens of Transaction Cost Economics (TCE) proposed by Oliver Williamson. Sewing machine components require exceptionally high 'Asset Specificity' (customized molds, unique alloys) and involve high 'Transaction Frequency'. In a globalized market fraught with uncertainty, relying on external suppliers creates a massive 'Hold-up Problem' (risk of supplier opportunism). By internalizing production (boosting component self-sufficiency), ZH minimizes external coordination costs, tightly controls quality, and protects proprietary designs.\n\nConversely, the $2.5 billion NTD acquisition of Yulon Tech is a textbook execution of an 'Unrelated Diversification' strategy. The end-consumer markets for household sewing machines (domestic DIY) and Yulon's outputs (automotive parts, robotics, medical devices) have practically zero overlap. The strategic rationale here is twofold: First, Risk Diversification—offsetting the cyclical downturns of the appliance market. Second, Supply-side Synergy—sharing advanced precision machining expertise, R&D talent, and achieving economies of learning across disparate industries.\n\nApplying the BCG Growth-Share Matrix provides a clear roadmap of ZH's portfolio: The traditional sewing machine business is the quintessential 'Cash Cow'. It commands a dominant, high relative market share in a mature, low-growth industry. Its primary function is to generate robust, stable free cash flow. Yulon's ventures into AI server liquid cooling and humanoid robotic reducers represent the 'Question Marks' (and potential future 'Stars'). These sectors boast explosive market growth but currently hold lower relative market shares globally. The overarching corporate mandate is clear: funnel the cash generated by the Sewing Cash Cow to aggressively fund the R&D and capacity expansion of Yulon's Question Marks, transforming them into tomorrow's market-leading Stars.",
        tw: "將分析層次提升至「集團層級策略 (Corporate Strategy)」，我們檢視伸興如何界定其企業版圖的邊界。在縫紉機本業上，伸興極力貫徹「向上游垂直整合（內部成長）」。我們透過威廉姆森 (Oliver Williamson) 的「交易成本理論 (TCE)」來解析：縫紉機零組件具備極高的「資產專屬性」（客製化模具、特殊合金）且「交易頻率」極高。在充滿不確定性的全球市場中，過度仰賴外部供應商將產生巨大的「套牢問題 (Hold-up Problem)」（供應商機會主義風險）。透過內部化生產（拉高零件自製率），伸興將外部協商與監督成本降至最低，嚴密控管品質，並保護核心設計機密。\n\n相對地，斥資新台幣 25 億元併購宇隆科技，則是極為經典的「非相關多角化」策略展現。家用縫紉機的終端市場（居家 DIY 消費者）與宇隆的目標市場（車用零組件、機器人大廠、醫療器械）幾乎毫無重疊。此舉背後的策略邏輯有二：其一為「風險分散」，藉由跨足不同景氣循環的產業，抵禦單一家電市場的衰退風險；其二為「供給面綜效」，兩家公司能共享高階精密金屬加工技術、研發人才，並跨產業實現學習曲線的經濟效益。\n\n套用「BCG 波士頓矩陣」能清晰勾勒出伸興的事業組合藍圖：傳統縫紉機事業是標準的「金牛 (Cash Cow)」。它在低成長的成熟產業中握有絕對領先的高相對市佔率，其首要任務是持續榨取穩定且強大的自由現金流。而宇隆積極切入的 AI 伺服器液冷快接頭與人形機器人減速機，則被定位為「問號 (Question Marks)」（以及潛在的未來「明星 Stars」）。這些新興領域具備爆發性的市場成長率，但目前在全球的相對市佔率尚待拓展。集團的最高指導原則極為明確：將金牛事業（縫紉機）所產生的豐沛現金，精準且猛烈地挹注於問號事業（宇隆新應用）的研發與擴產，全力將其培育成明日稱霸市場的明星事業。"
      },

/* ===== FlashCard Component ===== */
const FlashCard = ({ c, t, handleCardClick }) => {
  const [flipped, setFlipped] = useState(false);
  
  // Reset flipped state when the card content changes
  useEffect(() => {
    setFlipped(false);
  }, [c.term.en]);

  const onClick = () => {
    setFlipped(!flipped);
    handleCardClick();
  };

  return (
    <div className="perspective cursor-pointer h-48" onClick={onClick}>
      <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped ? 'rotate-y-180' : ''}`}>
        <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-6 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-md hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-colors">
          <span className="font-serif font-black text-xl md:text-2xl text-[#004030] dark:text-[#D8C3A5] text-center">{t(c.term)}</span>
          <span className="mt-4 text-xs text-slate-400 font-sans">Click to flip / 點擊翻轉</span>
        </div>
        <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-6 flex items-center justify-center shadow-md border border-[#004030] dark:border-[#D8C3A5]">
          <span className="text-sm md:text-base leading-relaxed font-semibold text-white dark:text-slate-200 text-center">{t(c.def)}</span>
        </div>
      </div>
    </div>
  );
};

const ThemeContentView = ({ themeData, t, tUI, navTo, lang, updateCardAnalytics, updateQuizAnalytics }) => {
  const [cardIdx, setCardIdx] = useState(0);
  const [quizIdx, setQuizIdx] = useState(0);
  const [quizAnswers, setQuizAnswers] = useState({});
  const [cardClicks, setCardClicks] = useState(0);
  
  const SVGVisual = SVG_COMPONENTS[themeData.id] || (() => <div/>);

  useEffect(() => {
    if (themeData && themeData.cards && themeData.cards.length > 0) {
      updateCardAnalytics(themeData.id, Math.min(2, themeData.cards.length), cardClicks);
    }
  }, [themeData, cardIdx, updateCardAnalytics, cardClicks]);

  const handleNextCards = () => {
    const newIdx = Math.min(cardIdx + 2, themeData.cards.length - 2);
    setCardIdx(newIdx);
    updateCardAnalytics(themeData.id, Math.min(newIdx + 2, themeData.cards.length), cardClicks);
  };

  const handleCardClick = () => {
    setCardClicks(c => c + 1);
    updateCardAnalytics(themeData.id, Math.min(cardIdx + 2, themeData.cards.length), cardClicks + 1);
  };

  const handleQuizSelect = (qIdx, optIdx) => {
    const newAns = {...quizAnswers, [qIdx]: optIdx};
    setQuizAnswers(newAns);
    let score = 0;
    themeData.quizzes.forEach((q, i) => {
      if (newAns[i] === q.ans) score++;
    });
    updateQuizAnalytics(themeData.id, score, Object.keys(newAns).length);
  };

  const handleNextQuiz = () => {
    setQuizIdx(Math.min(quizIdx + 2, themeData.quizzes.length - 2));
  };

  return (
    <div className="max-w-5xl mx-auto pb-12 animate-fade-in mt-4">
      <div className="flex justify-between items-center mb-6">
        <h1 className="text-3xl md:text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{t(themeData.title)}</h1>
      </div>

      <div className="flex flex-wrap gap-3 mb-8">
        {t(themeData.highlights).map((hl, i) => (
          <span key={i} className="px-4 py-1.5 bg-[#004030]/10 text-[#004030] dark:bg-[#D8C3A5]/10 dark:text-[#D8C3A5] text-sm font-bold rounded-full border border-[#004030]/20 dark:border-[#D8C3A5]/20 shadow-sm">★ {hl}</span>
        ))}
      </div>

      <div className="p-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl mb-12 text-lg leading-loose whitespace-pre-wrap font-medium">
        <h2 className="text-2xl font-serif font-black mb-5 flex items-center gap-2 border-b-2 border-slate-200 dark:border-slate-700 pb-3 text-[#004030] dark:text-[#D8C3A5]"><IconBookOpen size={24}/> {tUI('description')}</h2>
        {t(themeData.description)}
      </div>

      <div className="mb-12"><SVGVisual lang={lang}/></div>

      <div className="mb-12">
        <h2 className="text-2xl font-serif font-black mb-5 flex items-center gap-2 text-[#004030] dark:text-[#D8C3A5]"><IconTarget size={24}/> {tUI('flashcards')}</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
          {themeData.cards.slice(cardIdx, cardIdx + 2).map((c, i) => (
            <FlashCard key={i} c={c} t={t} handleCardClick={handleCardClick} />
          ))}
        </div>
        <div className="flex justify-between items-center text-sm font-bold text-slate-500 dark:text-slate-400">
          <div>{tUI('clicks')}: <span className="text-[#004030] dark:text-[#D8C3A5]">{cardClicks}</span> &nbsp;|&nbsp; {tUI('shown')}: <span className="text-[#004030] dark:text-[#D8C3A5]">{Math.min(cardIdx + 2, themeData.cards.length)}</span> / {tUI('total')}: {themeData.cards.length}</div>
          <div className="flex gap-3">
            <button onClick={() => setCardIdx(0)} disabled={cardIdx === 0} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 disabled:opacity-50 transition-colors"><IconRefreshCcw size={18}/></button>
            <button onClick={handleNextCards} disabled={cardIdx + 2 >= themeData.cards.length} className="px-4 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg disabled:opacity-50 flex items-center gap-1 font-bold shadow-md transition-colors"><IconChevronRight size={18}/> {tUI('next')} </button>
          </div>
        </div>
      </div>

      <div className="p-6 rounded-xl border-l-8 border-l-[#004030] dark:border-l-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/5 mb-12 shadow-sm">
        <h3 className="font-serif font-black text-[#004030] dark:text-[#D8C3A5] mb-2 text-xl">{tUI('wrapUp')}</h3>
        <p className="text-base md:text-lg italic font-medium text-slate-700 dark:text-slate-300">{t(themeData.wrapUp)}</p>
      </div>

      <div className="mb-12">
        <h2 className="text-2xl font-serif font-black mb-5 flex items-center gap-2 text-[#004030] dark:text-[#D8C3A5]"><IconCheckCircle size={24}/> {tUI('quiz')}</h2>
        <div className="space-y-6 mb-5">
          {themeData.quizzes.slice(quizIdx, quizIdx + 2).map((q, localIdx) => {
            const globalIdx = quizIdx + localIdx;
            const userAns = quizAnswers[globalIdx];
            const isAnswered = userAns !== undefined;
            const isCorrect = userAns === q.ans;
            
            return (
              <div key={globalIdx} className="p-6 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-md">
                <p className="font-bold mb-5 text-lg text-slate-800 dark:text-slate-200">Q: {t(q.q)}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {t(q.options).map((opt, oIdx) => {
                    let btnClass = "p-4 rounded-lg border-2 text-left text-base font-bold transition-all duration-200 ";
                    if (!isAnswered) btnClass += "hover:bg-[#004030]/5 dark:hover:bg-[#D8C3A5]/10 hover:border-[#004030] dark:hover:border-[#D8C3A5] border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-slate-700 dark:text-slate-300";
                    else if (oIdx === q.ans) btnClass += "bg-[#004030] dark:bg-[#D8C3A5] border-[#004030] dark:border-[#D8C3A5] text-white dark:text-[#004030] shadow-lg"; 
                    else if (oIdx === userAns) btnClass += "bg-red-500 border-red-600 text-white"; 
                    else btnClass += "border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 opacity-40";
                    
                    return (
                      <button key={oIdx} disabled={isAnswered} onClick={() => handleQuizSelect(globalIdx, oIdx)} className={btnClass}>
                        {opt}
                      </button>
                    );
                  })}
                </div>
                {isAnswered && (
                  <div className={`mt-4 text-base font-extrabold flex items-center gap-2 p-3 rounded-lg ${isCorrect ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'}`}>
                    {isCorrect ? <><IconCheckCircle size={20}/> {lang === 'en' ? 'Excellent judgment!' : '判斷精確！'}</> : <><IconXCircle size={20}/> {lang === 'en' ? 'Strategic Miss. Please review.' : '判斷錯誤，請重新審視本章策略理論。'}</>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div className="flex justify-between items-center text-sm font-bold text-slate-500 dark:text-slate-400">
           <div>{tUI('correct')}: <span className="text-[#004030] dark:text-[#D8C3A5]">{Object.keys(quizAnswers).filter(k => quizAnswers[k] === themeData.quizzes[k].ans).length}</span> &nbsp;|&nbsp; {tUI('answered')}: <span className="text-[#004030] dark:text-[#D8C3A5]">{Object.keys(quizAnswers).length}</span> / {tUI('total')}: {themeData.quizzes.length}</div>
           <div className="flex gap-3">

          {tUI('nextPage')} <IconChevronRight size={20}/>
        </button>
      </div>
    </div>
  );
};

const InteractiveLabView = ({ lang, tUI, navTo }) => {

             <div>
               <p className="text-sm font-bold text-slate-600 dark:text-slate-400 mb-4 h-16">{lang === 'en' ? "Q: Which VRIN trait best describes ZH's 40 years of profound trust built with global brands?" : "Q: 伸興40年來與全球頂級品牌所建立的深厚信任與默契，最主要屬於 VRIN 中的哪一項特質？"}</p>
               <div className="grid grid-cols-2 gap-2">
                 <button onClick={()=>setLab1Status(2)} className="py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded font-bold text-sm">Valuable (有價值)</button>
                 <button onClick={()=>setLab1Status(2)} className="py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded font-bold text-sm">Rare (稀有)</button>
                 <button onClick={()=>setLab1Status(1)} className="py-2 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] hover:bg-[#004030] hover:text-white dark:hover:bg-[#D8C3A5] dark:hover:text-[#004030] rounded font-bold text-sm transition-colors">Inimitable (難以模仿)</button>
                 <button onClick={()=>setLab1Status(2)} className="py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded font-bold text-sm">Non-substitutable</button>
               </div>
             </div>
           ) : (
             <div className={`h-full flex flex-col justify-center items-center p-4 rounded-lg font-bold text-center ${lab1Status === 1 ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'}`}>
               <p className="mb-4">{lab1Status === 1 ? (lang === 'en' ? 'Correct! This is Social Complexity.' : '正確！社會複雜性極難被競爭者輕易模仿。') : (lang === 'en' ? 'Incorrect. Please reconsider Social Complexity.' : '錯誤，請再思考「社會複雜性」防禦機制的特性。')}</p>
               <button onClick={()=>setLab1Status(0)} className="underline hover:opacity-70">{tUI('retry')}</button>

           <h3 className="font-serif font-black text-xl mb-3 flex items-center gap-2 text-[#004030] dark:text-[#D8C3A5]"><IconActivity /> Lab 2: BCG Matrix Plotter</h3>
           {lab2Status === 0 ? (
             <div>
               <p className="text-sm font-bold text-slate-600 dark:text-slate-400 mb-2 h-8">{lang === 'en' ? "Where does Yulon's new AI Robotic Reducer belong?" : "請點選：宇隆新研發的「AI 機器人減速機」應位於 BCG 矩陣的哪個象限？"}</p>
               <div className="relative mt-2 p-2">
                 <div className="grid grid-cols-2 gap-2 h-32 relative z-10">
                   <button onClick={()=>setLab2Status(2)} className="border-2 border-dashed border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center font-bold text-slate-500 rounded">Star (明星)</button>
                   <button onClick={()=>setLab2Status(1)} className="border-2 border-dashed border-slate-300 dark:border-slate-600 hover:bg-[#004030]/10 dark:hover:bg-[#D8C3A5]/10 hover:border-[#004030] dark:hover:border-[#D8C3A5] flex items-center justify-center font-bold text-slate-500 rounded transition-colors">Question Mark (問號)</button>
                   <button onClick={()=>setLab2Status(2)} className="border-2 border-dashed border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center font-bold text-slate-500 rounded">Cash Cow (金牛)</button>
                   <button onClick={()=>setLab2Status(2)} className="border-2 border-dashed border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center font-bold text-slate-500 rounded">Dog (落水狗)</button>
                 </div>
               </div>
             </div>
           ) : (
             <div className={`h-full flex flex-col justify-center items-center p-4 rounded-lg font-bold text-center ${lab2Status === 1 ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'}`}>
               <p className="mb-4">{lab2Status === 1 ? (lang === 'en' ? 'Correct! High growth, low relative share.' : '正確！高市場成長率、低相對市佔率，屬於急需資金挹注的問號區。') : (lang === 'en' ? 'Incorrect. Evaluate its growth and market share.' : '錯誤！請重新評估其高爆發成長與目前的低市佔現況。')}</p>
               <button onClick={()=>setLab2Status(0)} className="underline hover:opacity-70">{tUI('retry')}</button>
             </div>
           )}
         </div>
       </div>

       <div className="p-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl">
         <h3 className="font-serif font-black text-2xl mb-4 flex items-center gap-2 text-[#004030] dark:text-[#D8C3A5]"><IconMap /> Lab 3: Global Resource Allocation Simulator (全球佈局資源配置模擬)</h3>
         <p className="text-base mb-8 font-medium text-slate-600 dark:text-slate-400">{lang === 'en' ? "Act as the CEO. Adjust regional R&D and manufacturing capacity to witness the strategic impact on ZH's overall performance metrics." : "扮演集團執行長，調整各區域的研發與生產產能配比，動態觀察對伸興總體策略績效指標的影響。"}</p>
         
         <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div className="space-y-8">
              <div>
                <label className="flex justify-between text-base font-bold mb-2 text-slate-800 dark:text-slate-200">
                  <span>Taiwan (High-end R&D)</span> <span className="text-[#004030] dark:text-[#D8C3A5]">{sliders.tw}%</span>
                </label>
                <input type="range" min="0" max="100" value={sliders.tw} onChange={(e)=>setSliders({...sliders, tw: Number(e.target.value)})} className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-[#004030] dark:accent-[#D8C3A5]"/>
              </div>
              <div>
                <label className="flex justify-between text-base font-bold mb-2 text-slate-800 dark:text-slate-200">
                  <span>Vietnam (Mass Production)</span> <span className="text-[#004030] dark:text-[#D8C3A5]">{sliders.vn}%</span>
                </label>
                <input type="range" min="0" max="100" value={sliders.vn} onChange={(e)=>setSliders({...sliders, vn: Number(e.target.value)})} className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-[#004030] dark:accent-[#D8C3A5]"/>
              </div>
              <div>
                <label className="flex justify-between text-base font-bold mb-2 text-slate-800 dark:text-slate-200">
                  <span>China (Precision Metal)</span> <span className="text-[#004030] dark:text-[#D8C3A5]">{sliders.cn}%</span>
                </label>
                <input type="range" min="0" max="100" value={sliders.cn} onChange={(e)=>setSliders({...sliders, cn: Number(e.target.value)})} className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-[#004030] dark:accent-[#D8C3A5]"/>
              </div>
            </div>

            <div className="flex flex-col justify-center space-y-6 bg-slate-50 dark:bg-slate-900/50 p-6 rounded-xl border border-slate-200 dark:border-slate-700">
               <div>
                  <div className="flex justify-between text-sm font-bold text-slate-700 dark:text-slate-300 mb-2"><span>Innovation Capability (創新能耐)</span> <span>{Math.round(norm(metricInnovation))}</span></div>
                  <div className="h-4 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div className="h-full bg-blue-500 transition-all duration-300" style={{width: `${norm(metricInnovation)}%`}}></div>
                  </div>
               </div>
               <div>
                  <div className="flex justify-between text-sm font-bold text-slate-700 dark:text-slate-300 mb-2"><span>Cost Efficiency (成本效益)</span> <span>{Math.round(norm(metricCost))}</span></div>
                  <div className="h-4 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div className="h-full bg-green-500 transition-all duration-300" style={{width: `${norm(metricCost)}%`}}></div>
                  </div>
               </div>
               <div>
                  <div className="flex justify-between text-sm font-bold text-slate-700 dark:text-slate-300 mb-2"><span>Risk Resilience (風險抵禦力)</span> <span>{Math.round(norm(metricRisk))}</span></div>
                  <div className="h-4 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div className="h-full bg-amber-500 transition-all duration-300" style={{width: `${norm(metricRisk)}%`}}></div>
                  </div>
               </div>
            </div>
         </div>
       </div>

       {/* Next / Prev Navigation */}
       <div className="flex justify-between items-center pt-8 mt-12 border-t border-slate-300 dark:border-slate-700">
        <button onClick={() => navTo(5)} className="flex items-center gap-2 px-6 py-3 font-serif font-bold text-slate-500 hover:text-[#004030] dark:hover:text-[#D8C3A5] transition-colors uppercase tracking-wider text-sm">
          <IconChevronLeft size={20}/> {tUI('prevPage')}
        </button>
        <button onClick={() => navTo(7)} className="flex items-center gap-2 px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg font-serif font-bold shadow-md hover:bg-[#002b20] dark:hover:bg-white transition-colors uppercase tracking-wider text-sm">
          {tUI('nextPage')} <IconChevronRight size={20}/>
        </button>
      </div>
    </div>
  );
};

const AnalyticsView = ({ lang, tUI, analyticsData, navTo }) => {
  const [userData, setUserData] = useState({ group: '', id: '', name: '' });
  
  const handleExportCSV = () => {
    if(!userData.group || !userData.id || !userData.name) {
      alert(lang === 'en' ? "Please fill in all personal details." : "請完整填寫個人資料以利建檔。");
      return;
    }
    
    const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
    const filename = `ZH_StrategyReport_${userData.group}_${userData.name}_${dateStr}.csv`;
    
    let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + 
      "Module,TimeSpent(s),Interactions,CardReviewed(Viewed/Total),QuizScore(Correct/Answered/Total)\n";
    
    // Add per module data
    for (let i = 1; i <= 5; i++) {
        const d = analyticsData[i];
        csvContent += `Theme ${i},${d.time},${d.clicks},${d.cardsViewed}/${DICT.THEMES[i-1].cards.length},${d.quizCorrect}/${d.quizAnswered}/${DICT.THEMES[i-1].quizzes.length}\n`;
    }
    
    // Add User Data
    csvContent += `\nGroup,${userData.group}\nStudentID,${userData.id}\nName,${userData.name}\n`;
      
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const calculateTotal = (key) => Object.values(analyticsData).reduce((a, b) => a + b[key], 0);

  return (
    <div className="max-w-5xl mx-auto pb-12 animate-fade-in mt-4">
      <h1 className="text-3xl md:text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5] mb-6">{tUI('analytics')}</h1>
      
      <div className="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
        <div className="bg-white dark:bg-slate-800 rounded-xl p-6 text-center shadow-md border border-slate-200 dark:border-slate-700">
          <div className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">{tUI('timeSpent')}</div>
          <div className="text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{calculateTotal('time')}</div>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-6 text-center shadow-md border border-slate-200 dark:border-slate-700">
          <div className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">{tUI('clicks')}</div>
          <div className="text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{calculateTotal('clicks')}</div>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-6 text-center shadow-md border border-slate-200 dark:border-slate-700">
          <div className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">{tUI('cardRate')}</div>
          <div className="text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{calculateTotal('cardsViewed')}</div>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-6 text-center shadow-md border border-slate-200 dark:border-slate-700">
          <div className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">{tUI('quizRate')}</div>
          <div className="text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{calculateTotal('quizCorrect')}</div>
        </div>
      </div>

      <div className="bg-white dark:bg-slate-800 rounded-xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl mb-10 overflow-x-auto">
        <h3 className="font-serif font-black text-xl mb-6 text-[#004030] dark:text-[#D8C3A5]">Module Breakdown (各分頁紀錄)</h3>
        <table className="w-full text-sm text-left">
            <thead>
                <tr className="border-b-2 border-slate-200 dark:border-slate-700 text-[#004030] dark:text-[#D8C3A5]">
                    <th className="pb-3 pr-4">Theme</th>
                    <th className="pb-3 px-4">Time (s)</th>
                    <th className="pb-3 px-4">Clicks</th>
                    <th className="pb-3 px-4">Cards (View/Total)</th>
                    <th className="pb-3 pl-4">Quiz (Corr/Ans/Total)</th>
                </tr>
            </thead>
            <tbody>
                {[1, 2, 3, 4, 5].map(i => {
                    const d = analyticsData[i];
                    const tData = DICT.THEMES[i-1];
                    return (
                    <tr key={i} className="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30">
                        <td className="py-3 pr-4 font-bold text-slate-700 dark:text-slate-300 truncate max-w-[200px]">{tData.title[lang]}</td>
                        <td className="py-3 px-4">{d.time}</td>
                        <td className="py-3 px-4">{d.clicks}</td>
                        <td className="py-3 px-4">{d.cardsViewed} / {tData.cards.length}</td>
                        <td className="py-3 pl-4">{d.quizCorrect} / {d.quizAnswered} / {tData.quizzes.length}</td>
                    </tr>
                    )
                })}
            </tbody>
        </table>
      </div>

      <div className="bg-white dark:bg-slate-800 rounded-xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl">
        <h3 className="font-serif font-black text-2xl mb-6 flex items-center gap-2 text-[#004030] dark:text-[#D8C3A5]"><IconDownload /> {tUI('exportCSV')}</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <input type="text" placeholder={tUI('group')} value={userData.group} onChange={e => setUserData({...userData, group: e.target.value})} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 focus:border-[#004030] dark:focus:border-[#D8C3A5] outline-none font-bold"/>
          <input type="text" placeholder={tUI('studentId')} value={userData.id} onChange={e => setUserData({...userData, id: e.target.value})} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 focus:border-[#004030] dark:focus:border-[#D8C3A5] outline-none font-bold"/>
          <input type="text" placeholder={tUI('name')} value={userData.name} onChange={e => setUserData({...userData, name: e.target.value})} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 focus:border-[#004030] dark:focus:border-[#D8C3A5] outline-none font-bold"/>
        </div>
        <div className="flex gap-4">
           <button onClick={handleExportCSV} className="px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg font-bold shadow-md hover:bg-[#002b20] dark:hover:bg-white flex items-center gap-2 transition-all"><IconDownload size={20}/> Export Research Data</button>
           <button onClick={() => window.location.reload()} className="px-8 py-3 rounded-lg font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">{tUI('resetData')}</button>
        </div>
      </div>

      {/* Next / Prev Navigation */}
      <div className="flex justify-between items-center pt-8 mt-12 border-t border-slate-300 dark:border-slate-700">
        <button onClick={() => navTo(7)} className="flex items-center gap-2 px-6 py-3 font-serif font-bold text-slate-500 hover:text-[#004030] dark:hover:text-[#D8C3A5] transition-colors uppercase tracking-wider text-sm">
          <IconChevronLeft size={20}/> {tUI('prevPage')}
        </button>
        <button onClick={() => navTo(0)} className="flex items-center gap-2 px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg font-serif font-bold shadow-md hover:bg-[#002b20] dark:hover:bg-white transition-colors uppercase tracking-wider text-sm">
          Return to Summary <IconChevronRight size={20}/>
        </button>
      </div>
    </div>
  );
};

          </a>
          <a href="https://www.yulon.com.tw/" target="_blank" rel="noreferrer" className="p-5 bg-slate-50 dark:bg-slate-900/50 rounded-lg hover:border-[#004030] dark:hover:border-[#D8C3A5] border border-slate-200 dark:border-slate-700 text-[#004030] dark:text-[#D8C3A5] font-bold flex items-center justify-between transition-all shadow-sm">
            <span>Yulon Tech (宇隆科技) Innovation Hub</span> <IconGlobe size={22}/>
          </a>
          <a href="https://mops.twse.com.tw/mops/web/index" target="_blank" rel="noreferrer" className="p-5 bg-slate-50 dark:bg-slate-900/50 rounded-lg hover:border-[#004030] dark:hover:border-[#D8C3A5] border border-slate-200 dark:border-slate-700 text-[#004030] dark:text-[#D8C3A5] font-bold flex items-center justify-between transition-all shadow-sm">
            <span>Market Observation Post System (台灣公開資訊觀測站)</span> <IconGlobe size={22}/>
          </a>
          <a href="https://www.bcg.com/about/our-history/growth-share-matrix" target="_blank" rel="noreferrer" className="p-5 bg-slate-50 dark:bg-slate-900/50 rounded-lg hover:border-[#004030] dark:hover:border-[#D8C3A5] border border-slate-200 dark:border-slate-700 text-[#004030] dark:text-[#D8C3A5] font-bold flex items-center justify-between transition-all shadow-sm">
            <span>BCG Matrix Framework (波士頓顧問集團學術資源)</span> <IconGlobe size={22}/>
          </a>
       </div>

       {/* Next / Prev Navigation */}
       <div className="flex justify-between items-center pt-8 mt-12 border-t border-slate-300 dark:border-slate-700">
        <button onClick={() => navTo(6)} className="flex items-center gap-2 px-6 py-3 font-serif font-bold text-slate-500 hover:text-[#004030] dark:hover:text-[#D8C3A5] transition-colors uppercase tracking-wider text-sm">
          <IconChevronLeft size={20}/> {tUI('prevPage')}
        </button>
        <button onClick={() => navTo(8)} className="flex items-center gap-2 px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg font-serif font-bold shadow-md hover:bg-[#002b20] dark:hover:bg-white transition-colors uppercase tracking-wider text-sm">
          {tUI('nextPage')} <IconChevronRight size={20}/>
        </button>
      </div>
    </div>
  );
};

/* ===== MAIN APP COMPONENT ===== */
function App() {
  useSecurity(); 
  
  const [lang, setLang] = useState('en'); 
  const [isDark, setIsDark] = useState(false);
  const [currentPage, setCurrentPage] = useState(0); 
  const [menuOpen, setMenuOpen] = useState(false);
  const [speechSynthesisActive, setSpeechSynthesisActive] = useState(false);
  
  // Analytics State - Tracked per module
  const [analyticsData, setAnalyticsData] = useState(() => {
    let initial = {};
    for (let i = 0; i <= 8; i++) {
        initial[i] = { time: 0, clicks: 0, cardsViewed: 0, quizCorrect: 0, quizAnswered: 0 };
    }
    return initial;
  });

  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDark);
  }, [isDark]);

  useEffect(() => {
    const timer = setInterval(() => {
        setAnalyticsData(prev => ({
            ...prev,
            [currentPage]: { ...prev[currentPage], time: prev[currentPage].time + 1 }
        }));
    }, 1000);
    return () => clearInterval(timer);
  }, [currentPage]);

  const handleGlobalClick = useCallback(() => {
    setAnalyticsData(prev => ({
        ...prev,
        [currentPage]: { ...prev[currentPage], clicks: prev[currentPage].clicks + 1 }
    }));
  }, [currentPage]);

  const t = useCallback((keyDict) => keyDict[lang], [lang]);
  const tUI = useCallback((key) => DICT.UI[key][lang], [lang]);

  const speakText = useCallback((text = null) => {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    
    let contentToRead = text;
    if (!contentToRead) {
        // Full page read logic
        if (currentPage === 0) {
            contentToRead = `${DICT.OVERVIEW.title[lang]}. ${DICT.OVERVIEW.content[lang]}`;
        } else if (currentPage >= 1 && currentPage <= 5) {
            const th = DICT.THEMES[currentPage-1];
            contentToRead = `${th.title[lang]}. ${DICT.UI.highlights[lang]}: ${th.highlights[lang].join(", ")}. ${DICT.UI.description[lang]}: ${th.description[lang]}. ${DICT.UI.wrapUp[lang]}: ${th.wrapUp[lang]}.`;
        } else {
            contentToRead = lang === 'en' ? "Please navigate to a theory section to use full page reading." : "請導航至理論章節以使用全頁朗讀功能。";
        }
    }

    const utterance = new SpeechSynthesisUtterance(contentToRead);
    utterance.lang = lang === 'en' ? 'en-GB' : 'zh-TW';
    utterance.rate = 1.0;
    
    const voices = synth.getVoices();
    if (lang === 'en') {
      const enVoice = voices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male'));
      if(enVoice) utterance.voice = enVoice;
    } else {
      const twVoice = voices.find(v => v.lang === 'zh-TW' && (v.name.toLowerCase().includes('yating') || v.name.toLowerCase().includes('female')));
      if(twVoice) utterance.voice = twVoice;
    }
    
    utterance.onstart = () => setSpeechSynthesisActive(true);
    utterance.onend = () => setSpeechSynthesisActive(false);
    utterance.onerror = () => setSpeechSynthesisActive(false);
    synth.speak(utterance);
  }, [lang, currentPage]);
  
  const stopSpeak = useCallback(() => {
    const synth = window.speechSynthesis;
    if(synth) { 
      synth.cancel(); 
      setSpeechSynthesisActive(false); 
    }
  }, []);

  const updateCardAnalytics = useCallback((themeId, viewed, clicks) => {
    setAnalyticsData(prev => ({
        ...prev,
        [themeId]: { 
            ...prev[themeId], 
            cardsViewed: Math.max(prev[themeId].cardsViewed, viewed),
            clicks: prev[themeId].clicks + (clicks ? 1 : 0) // simplistic tracking
        }
    }));
  }, []);

  const updateQuizAnalytics = useCallback((themeId, correct, answered) => {
    setAnalyticsData(prev => ({
        ...prev,
        [themeId]: { 
            ...prev[themeId], 
            quizCorrect: Math.max(prev[themeId].quizCorrect, correct),
            quizAnswered: Math.max(prev[themeId].quizAnswered, answered)
        }
    }));
  }, []);

  const navTo = useCallback((pageIdx) => {
    stopSpeak();
    setCurrentPage(pageIdx);
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [stopSpeak]);

  const renderPage = () => {
    if (currentPage === 0) {
      return <OverviewView t={t} navTo={navTo} />;
    }
    if (currentPage >= 1 && currentPage <= 5) {
      return <ThemeContentView key={currentPage} themeData={DICT.THEMES[currentPage-1]} t={t} tUI={tUI} lang={lang} navTo={navTo} updateCardAnalytics={updateCardAnalytics} updateQuizAnalytics={updateQuizAnalytics} />;
    }
    if (currentPage === 6) return <InteractiveLabView lang={lang} tUI={tUI} navTo={navTo} />;
    if (currentPage === 7) return <ResourcesView tUI={tUI} navTo={navTo} />;
    if (currentPage === 8) return <AnalyticsView lang={lang} tUI={tUI} analyticsData={analyticsData} navTo={navTo} />;
    return <OverviewView t={t} navTo={navTo} />;
  };

  return (
    <div className="flex flex-col min-h-screen" onClick={handleGlobalClick}>
      <TopHeader menuOpen={menuOpen} setMenuOpen={setMenuOpen} navTo={navTo} tUI={tUI} speakText={speakText} stopSpeak={stopSpeak} speechSynthesisActive={speechSynthesisActive} lang={lang} setLang={setLang} isDark={isDark} setIsDark={setIsDark} />
      <DrawerMenu menuOpen={menuOpen} navTo={navTo} tUI={tUI} t={t} currentPage={currentPage} />
      
      {menuOpen && <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 transition-opacity" onClick={() => setMenuOpen(false)}></div>}
      
      <main className="flex-1 pt-16 pb-16 px-4 transition-colors duration-300">
        {renderPage()}
      </main>

      <FooterBlock />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
